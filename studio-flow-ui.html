<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Playfair Display, not Instrument Serif: the latter ships no Vietnamese subset,
     so ầ/ề/ố split into base letter + floating accent. Same editorial voice, full diacritics. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Claude handoff translated into the production DOM. The app deliberately uses
   lines, type and spacing instead of cards, shadows or decorative chrome. */
:root{
  --ink:#111112;--text-2:#8a8a85;--mono-2:#a8a7a2;--faint:#c9c8c3;
  --line:#e8e7e4;--image:#f6f5f3;--empty:#fafaf9;--empty-hover:#f4f4f1;
  --success:#7d9482;--warning:#9c6b52;--paper:#fff;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Geist","Segoe UI Variable Text","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
h1,h2,p,figure{margin:0} button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer} input{font:inherit;color:inherit} img{display:block;max-width:100%}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px} h1:focus,h1:focus-visible{outline:0}
::selection{background:var(--ink);color:#fff}::-webkit-scrollbar{width:0;height:0;display:none}
.scrollY{min-height:0;overflow-y:auto;overflow-x:hidden}
.shell{height:100vh;display:flex;flex-direction:column;padding:0 40px;overflow:hidden;background:#fff}
.row{width:100%}

/* Header and process rail */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:20px 0 18px}
.wordmark{font:400 19px/1 var(--serif);letter-spacing:-.01em}
.top-right{display:flex;align-items:baseline;gap:24px}
.top .link,.conn{font:400 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.conn{color:var(--success)}.conn .dot{display:none}.conn.is-error,.notice{color:var(--warning)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding-bottom:28px}
.step-slot{display:flex;flex-direction:column;gap:9px;min-width:0}
.step-line{display:flex;align-items:baseline;gap:8px;min-width:0}
.step{display:flex;align-items:baseline;flex:0 1 auto;min-width:0;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.step:disabled{cursor:not-allowed}
.step-bar{width:100%;height:1px;background:var(--line)}
.step-slot.is-past .step-bar,.step-slot.is-now .step-bar{background:var(--ink)}
.step .lab{display:flex;align-items:baseline;gap:8px;min-width:0}
.step .n,.step .t,.step .flag,.step-option{font:400 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.step .n{letter-spacing:0;text-transform:none;color:var(--faint)}
.step .t{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.is-past .t{color:var(--text-2)} .step.is-now .t{color:var(--ink)}
.step .flag{color:var(--warning)}
.step-option{flex:0 0 auto;color:#dedcd7;white-space:nowrap}.step-option.is-on{color:var(--ink)}
.step-slot.is-skip .step .t{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}

/* Stage */
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.title-row{min-height:66px;padding-bottom:28px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.title-box{display:flex;flex-direction:column;gap:6px;min-width:0}
h1{font:400 34px/1.05 var(--serif);letter-spacing:-.02em}
.lede{min-height:20px;max-width:62ch;color:var(--text-2);font-size:13px;line-height:1.5;text-wrap:pretty}
.count{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.count b{font:400 26px/1 var(--serif)} .count span{font:400 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2)}
.screen{flex:1;min-height:0;display:none}.screen.is-on{display:block}
.notice{margin-top:-18px;padding-bottom:12px;font-size:13px;line-height:1.5}.notice b{color:var(--ink);font-weight:500}

/* Shared controls */
.link,.back,.model-remove{font:400 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2);text-decoration:none}
.link:hover,.back:hover,.model-remove:hover{color:var(--ink)}.product [data-act="rm-product"]:hover,.model-remove:hover{color:var(--warning)}
.link:disabled,.model-remove:disabled{color:var(--faint);cursor:not-allowed}
.solid{min-width:212px;background:var(--ink);color:#fff;padding:13px 26px;font-size:13px;font-weight:500;text-align:center}
.solid:hover:not(:disabled){background:#000}.solid:disabled{background:var(--line);color:var(--mono-2);cursor:not-allowed}
.tile{aspect-ratio:4/5;background:var(--empty);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tile:hover{background:var(--empty-hover)}
.tile .plus{font:400 28px/1 var(--serif);color:var(--mono-2)} .tile .t{font-size:13px}.tile .s{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.mono,.eyebrow{font:400 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2)}
.serif-note{font:400 19px/1.4 var(--serif);color:var(--success)}
.spin{display:inline-block;width:10px;height:10px;border:1px solid var(--line);border-top-color:var(--ink);border-radius:50%;vertical-align:-1px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}} @media(prefers-reduced-motion:reduce){*{animation-duration:2.4s!important;transition:none!important}}

/* Products */
.grid-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:32px 24px}
.product{display:flex;flex-direction:column;gap:10px;min-width:0}
.product .shot{position:relative;aspect-ratio:4/5;background:var(--image);overflow:hidden}.product .shot img{width:100%;height:100%;object-fit:cover}
.product .meta{display:flex;align-items:baseline;gap:10px;min-width:0}.product .meta .mono{letter-spacing:0;text-transform:none;color:var(--faint)}.product .meta .code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product .acts{display:flex;gap:16px;flex-wrap:wrap}.views{display:flex;gap:6px;flex-wrap:wrap}
.view{position:relative;width:34px;height:43px;background:var(--image);overflow:hidden}.view img{width:100%;height:100%;object-fit:cover}
.view button{position:absolute;inset:0;border:0;background:rgba(17,17,18,.68);color:#fff;font-size:11px;cursor:pointer;opacity:0}.view:hover button,.view:focus-within button{opacity:1}

/* Models */
.split2{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 252px;gap:48px;min-height:0}
.grid-models{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:24px 18px}
.model{display:flex;flex-direction:column;gap:9px;min-width:0}.model .shot{aspect-ratio:3/4;background:var(--image);overflow:hidden}
.model .shot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.model-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.model-remove{color:var(--faint)}
.grid-models .tile .t{font:400 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)!important}
.aside-col{display:flex;flex-direction:column;gap:24px;min-height:0}.aside-col h2{font:400 19px/1.25 var(--serif)}
.tip{display:flex;flex-direction:column;gap:4px}.tip b{font-size:13px;font-weight:500}.tip span{font-size:13px;color:var(--text-2);line-height:1.5;text-wrap:pretty}

/* Evaluation */
.split3{height:100%;display:grid;grid-template-columns:226px minmax(0,1fr);gap:48px;min-height:0}
.pick-list,.queue{display:flex;flex-direction:column;gap:2px;min-height:0}
.pick{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 0;text-align:left;opacity:.45}
.qitem{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:8px 0;text-align:left;opacity:.45}
.pick:hover,.qitem:hover,.pick[aria-current="true"],.qitem[aria-current="true"]{opacity:1}
.pick .th,.qitem .th{width:34px;height:43px;background:var(--image);object-fit:cover}
.pick .col,.qitem .col{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick .nm,.qitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .gr,.qitem .st{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2)}.pick .sc{font:400 12px var(--mono);color:var(--text-2)}
.qitem .st.run{color:var(--ink)}.qitem .st.fail{color:var(--warning)}.qitem .st.ok{color:var(--success)}
.detail3{min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:28px;padding-right:4px}
.scores{flex:0 0 auto;display:flex;gap:64px;flex-wrap:wrap}.scorecell{display:flex;flex-direction:column;gap:6px}
.scorecell .k{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2)}.scorecell .v{font:400 40px/1 var(--serif)}
.scorecell .v small,.qc-score .v small{font:400 11px var(--mono);color:var(--faint);margin-left:4px}
.scorecell .n{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--success)}.scorecell .n.is-warn{color:var(--warning)}
.cand-block{flex:0 0 auto;display:flex;flex-direction:column;gap:12px}.cand-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cand-row{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding-bottom:4px}
.cand{flex:0 0 112px;width:112px;text-align:left;display:flex;flex-direction:column;gap:8px;opacity:.45}
.cand:hover,.cand.is-on{opacity:1}.cand .shot{display:block;aspect-ratio:3/4;background:var(--image);overflow:hidden}.cand .shot img{width:100%;height:100%;object-fit:cover}
.cand .cl{display:flex;align-items:baseline;justify-content:space-between;gap:6px}.cand .nm{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}.cand .sc{font:400 12px var(--mono);color:var(--ink)}.cand .gr{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);min-height:2.8em}.cand .gr b{font-weight:400;color:inherit}
.notes{flex:0 0 auto;min-height:0;display:flex;flex-direction:column;gap:12px}.notes p{max-width:76ch;color:var(--text-2);line-height:1.6;text-wrap:pretty}.notes .link{margin-top:4px}

/* Render and QC share the same production frame */
.split4,.split5{height:100%;display:grid;grid-template-columns:226px minmax(0,1fr) 252px;gap:48px;min-height:0}
.canvas{min-height:0;min-width:0;display:grid;place-items:center}
.canvas .frame{height:100%;max-width:100%;aspect-ratio:3/4;background:var(--image);display:grid;place-items:center;position:relative;overflow:hidden}.canvas .frame img{width:100%;height:100%;object-fit:contain}
.canvas .over,.busy-veil{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:var(--image);padding:24px;text-align:center}
.canvas .over b,.busy-veil b{font:400 20px/1.3 var(--serif)}.canvas .over span,.busy-veil span{font-size:13px;max-width:32ch;color:var(--text-2);line-height:1.5}
.meta-col{display:flex;flex-direction:column;gap:16px;min-height:0}.meta-col h2{font:400 19px/1.25 var(--serif);overflow-wrap:anywhere}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.kv .k{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2)}.kv .v{font:400 12px var(--mono);text-align:right}

/* QC comparison */
.compare{height:100%;min-height:0;max-width:100%;aspect-ratio:3/4;position:relative;overflow:hidden;cursor:ew-resize;touch-action:none;background:var(--image);margin:0 auto}
.layer{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.layer img{width:100%;height:100%;object-fit:contain}
.layer.top{width:100%;background:#fff;clip-path:inset(0 var(--clip,50%) 0 0)}
.handleLine{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);z-index:4}.busy-veil{z-index:6;background:rgba(246,245,243,.94)}
.qc-right{display:flex;flex-direction:column;gap:20px;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding-right:14px}
.qc-controls{flex:0 0 auto;display:flex;flex-direction:column;gap:11px;font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.qc-position,.qc-versions{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.qc-position .k,.qc-versions .k{color:var(--mono-2)}
.vset{display:flex;gap:14px}.vbtn{color:var(--faint);font:400 11px var(--mono);letter-spacing:.08em}.vbtn[aria-pressed="true"]{color:var(--ink)}
.qc-score{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between}.qc-score .k{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2)}.qc-score .v{font:400 32px/1 var(--serif)}
.qc-list{flex:0 0 auto;min-height:0;display:flex;flex-direction:column;gap:11px}.qc-list .kv .k{font:400 13px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}.qc-list .kv .v{font:400 12px var(--mono);color:var(--text-2)}.qc-note-head{margin-top:8px}
.qc-acts{flex:0 0 auto;display:flex;flex-direction:column;gap:14px;padding-top:4px}.qc-acts .solid{padding:13px 22px}.qc-acts .pair{display:flex;gap:18px;flex-wrap:wrap}

/* Footer, feedback and lightbox */
.foot{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0 26px}.foot .note{font:400 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mono-2)}.foot .note b{color:var(--ink);font-weight:400}
.foot .acts{display:flex;align-items:center;gap:28px}.back{min-width:150px;text-align:right}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:9px 16px;opacity:0;pointer-events:none;transition:.16s;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}
dialog.light{border:0;padding:0;background:none;max-width:min(92vw,1000px)}dialog.light::backdrop{background:rgba(17,17,18,.62)}
.light-in{background:#fff;display:flex;flex-direction:column;max-height:90vh}.light-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.light-hd strong{font-weight:500}.light-bd{min-height:0;overflow:auto;background:var(--image)}.light-bd img{width:100%;max-height:76vh;object-fit:contain}

@media(max-width:1080px){
  .split4,.split5{grid-template-columns:200px minmax(0,1fr);grid-template-areas:"q c" "r r";gap:28px}
  .split4>.queue,.split5>.queue{grid-area:q}.split4>.canvas,.split5>.canvas{grid-area:c}.meta-col,.qc-right{grid-area:r;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  html,body{height:auto;overflow:auto}.shell{height:auto;min-height:100vh;padding:0 20px;overflow:visible}.steps{overflow-x:auto}
  .title-row{padding-bottom:20px}.split2,.split3,.split4,.split5{grid-template-columns:minmax(0,1fr);grid-template-areas:none;height:auto;gap:28px}
  .split4>.queue,.split5>.queue,.split4>.canvas,.split5>.canvas,.meta-col,.qc-right{grid-area:auto}.meta-col,.qc-right{display:flex}.canvas{min-height:56vh}.canvas .frame,.compare{height:auto;width:100%;max-height:70vh}.screen{min-height:0}.foot{align-items:flex-end}.foot .note{max-width:45%}
}
@media(max-width:640px){.shell{padding:0 14px}.top{padding-top:14px}.steps{gap:12px}.step-slot{min-width:120px}.title-row{align-items:flex-end}.count{display:none}.grid-products{grid-template-columns:1fr}.foot{align-items:stretch}.foot .note{display:none}.foot .acts{width:100%;display:grid;grid-template-columns:1fr 1.4fr}.solid{min-width:0}}
@media(pointer:coarse){.link,.vbtn,.model-remove{min-height:40px}.view button{opacity:1}}
</style>
</head>
<body>

<div class="shell">

  <header class="row top">
    <span class="wordmark">Studio Flow</span>
    <div class="top-right">
      <button class="link" data-act="reset" id="resetBtn">Lượt mới</button>
      <div class="conn" id="conn"><span class="dot"></span><span id="connText">đang kiểm tra kết nối…</span></div>
    </div>
  </header>

  <nav class="row steps" id="steps" aria-label="Tiến trình 5 bước"></nav>

  <section class="row main">
    <div class="title-row">
      <div class="title-box">
        <h1 id="title" tabindex="-1">Chọn ảnh sản phẩm</h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="count"><b id="countA">0</b><span id="countB"></span></div>
    </div>
    <p class="notice" id="notice" role="alert" aria-live="assertive" aria-atomic="true" hidden></p>

    <div class="screen is-on" id="s1"></div>
    <div class="screen" id="s2"></div>
    <div class="screen" id="s3"></div>
    <div class="screen" id="s4"></div>
    <div class="screen" id="s5"></div>
  </section>

  <footer class="row foot">
    <span class="note" id="footNote"></span>
    <div class="acts">
      <button class="back" id="backBtn">← Quay lại</button>
      <button class="solid" id="nextBtn">Tiếp tục →</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="vh" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<dialog class="light" id="light">
  <div class="light-in">
    <div class="light-hd"><strong id="lightTitle">Xem ảnh</strong>
      <form method="dialog"><button class="link">Đóng</button></form></div>
    <div class="light-bd"><img id="lightImg" alt=""></div>
  </div>
</dialog>

<input type="file" id="fProduct" class="vh" tabindex="-1" accept="image/jpeg,image/png,image/webp" multiple>
<input type="file" id="fView" class="vh" tabindex="-1" accept="image/jpeg,image/png,image/webp" multiple>
<input type="file" id="fModel" class="vh" tabindex="-1" accept="image/jpeg,image/png,image/webp" multiple>

<script>
"use strict";
/* Business rules fixed by the product spec. */
const MAX_PRODUCTS=5, MAX_VIEWS=8, MAX_MODELS=10, MAX_VERSIONS=4, MIN_PX=128;
const TYPES=["image/jpeg","image/png","image/webp"];
const UNIT_SECONDS={codex:{eval:60,render:80},api:{eval:12,render:25}};

const STEPS=[
  {n:1,label:"Ảnh sản phẩm",title:"Chọn ảnh sản phẩm",lede:"Chọn 1–5 ảnh chính. Mỗi ảnh là một sản phẩm."},
  {n:2,label:"Người mẫu",title:"Ảnh người mẫu dùng chung",lede:"Tải 1–10 ảnh. Hệ thống chọn mẫu phù hợp cho từng sản phẩm."},
  {n:3,label:"Kiểm tra",title:"Đánh giá đầu vào",lede:"Điểm thấp không tự chặn bước tạo ảnh."},
  {n:4,label:"Tạo ảnh",title:"Tạo ảnh",lede:"Tự động lưu, tối đa 4 phiên bản mỗi sản phẩm."},
  {n:5,label:"QC",title:"QC",lede:"So sánh ảnh sản phẩm với kết quả."}
];

const state={
  step:1, products:[], models:[], active:null,
  analyzing:false, batchBusy:false, job:"",
  apiReady:false, backend:"api", apiModel:"gpt-image-2",
  connMessage:"đang kiểm tra kết nối…",
  skipEvaluation:false, skipQc:false,
  split:50, dragging:false
};
let seq=0, viewTarget=null;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const byId=id=>state.products.find(p=>p.id===id);
const current=()=>byId(state.active)||state.products[0]||null;
function clearProductError(p){
  if(!p) return;
  p.error=null; p.errorCode=null; p.retryable=true;
}
function setProductError(p,error){
  p.error=error?.message||"Không thể tạo ảnh.";
  p.errorCode=error?.code||null;
  p.retryable=error?.retryable!==false;
}
const needsRender=p=>!p.outputs.length;
// The primary button represents every product still missing an image. A previous
// failure stays visible on its card, but a fresh button click is an explicit retry.
const renderQueue=()=>state.products.filter(needsRender);
const failedQueue=()=>state.products.filter(p=>needsRender(p)&&p.error);
const missingMappedModels=()=>state.skipEvaluation?Math.max(0,state.products.length-state.models.length):0;
function mappedModelIndex(p){
  const productIndex=state.products.findIndex(item=>item.id===p.id);
  return state.skipEvaluation?Math.max(0,productIndex):(p.selectedModel??0);
}
const urlCache=new WeakMap();
const objUrl=f=>{ if(!urlCache.has(f)) urlCache.set(f,URL.createObjectURL(f)); return urlCache.get(f); };
const dataCache=new WeakMap();
function releaseFile(f){
  if(!f) return;
  const url=urlCache.get(f);
  if(url) URL.revokeObjectURL(url);
  urlCache.delete(f); dataCache.delete(f);
}
function asDataUrl(f){
  if(dataCache.has(f)) return dataCache.get(f);
  const job=new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(new Error(`Không đọc được ${f.name}.`)); r.readAsDataURL(f); });
  dataCache.set(f,job); return job;
}

let toastTimer=null;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),3200); }
const announce=m=>{ $("#live").textContent=m; };
const notify=m=>{ toast(m); announce(m); };
function notice(title,body){ const el=$("#notice");
  if(!title){ el.hidden=true; el.innerHTML=""; return; }
  el.hidden=false; el.innerHTML=`<b>${esc(title)}</b> ${esc(body||"")}`; }

/* Five advisory bands, mirroring the server's fiveLevel(). */
function band(score){ const v=clamp(Number(score)||0,0,100);
  if(v>=90) return {n:5,label:"Xuất sắc"}; if(v>=82) return {n:4,label:"Tốt"};
  if(v>=72) return {n:3,label:"Có thể thử"}; if(v>=60) return {n:2,label:"Rủi ro cao"};
  return {n:1,label:"Không phù hợp"}; }

function eta(units,kind){ if(!units||units<1) return "";
  const s=units*(UNIT_SECONDS[state.backend]||UNIT_SECONDS.api)[kind];
  return s<90?`khoảng ${Math.round(s)} giây`:`khoảng ${Math.round(s/60)} phút`; }

/* ------------------------------- intake --------------------------------- */
async function screenFiles(files){
  const ok=[],bad=[];
  for(const f of files){
    if(!TYPES.includes(f.type)){ bad.push(`${f.name}: chỉ nhận JPG, PNG hoặc WEBP.`); continue; }
    if(!f.size){ bad.push(`${f.name}: tệp trống.`); continue; }
    try{ const b=await createImageBitmap(f); const {width,height}=b; b.close();
      if(width<MIN_PX||height<MIN_PX){ bad.push(`${f.name}: ảnh quá nhỏ (${width}×${height}px).`); continue; }
    }catch{ bad.push(`${f.name}: không mở được ảnh.`); continue; }
    ok.push(f);
  }
  return {ok,bad};
}
const nameOf=f=>f.name.replace(/\.[^.]+$/,"").replace(/[_-](front|back|side|detail|main)$/i,"")
  .replace(/[_-]+/g," ").trim()||`Sản phẩm ${seq+1}`;

function stale(p,dropOutputs=false){
  p.evaluation=null; p.evaluationSkipped=false; p.candidates=[]; p.selectedModel=null; p.aiPick=null; clearProductError(p);
  if(dropOutputs){ p.outputs=[]; p.selectedOutput=0; p.status="idle"; p.lastQc=null; }
}

async function addProducts(files){
  const room=MAX_PRODUCTS-state.products.length;
  if(room<=0){ notice("Đã đủ 5 sản phẩm","Xoá bớt nếu muốn thêm sản phẩm khác."); return; }
  const {ok,bad}=await screenFiles(files);
  ok.slice(0,room).forEach(f=>{ seq+=1;
    state.products.push({id:`p${seq}`,name:nameOf(f),files:[f],evaluation:null,candidates:[],
      selectedModel:null,aiPick:null,outputs:[],selectedOutput:0,status:"idle",error:null,errorCode:null,
      retryable:true,lastQc:null}); });
  if(ok.length) state.active=state.products[state.products.length-1].id;
  notice(bad.length?"Một số ảnh bị bỏ qua":"",bad.join(" "));
  if(ok.length) notify(`Đã thêm ${Math.min(ok.length,room)} sản phẩm.`);
  render();
}
async function addViews(p,files){
  const room=MAX_VIEWS-p.files.length;
  if(room<=0){ notice("Sản phẩm đã đủ ảnh",`Mỗi sản phẩm giữ tối đa ${MAX_VIEWS} ảnh.`); return; }
  const {ok,bad}=await screenFiles(files);
  if(ok.length){ p.files.push(...ok.slice(0,room)); stale(p,true); }
  notice(bad.length?"Một số ảnh bị bỏ qua":"",bad.join(" ")); render();
}
async function addModels(files){
  const room=MAX_MODELS-state.models.length;
  if(room<=0){ notice("Đã đủ 10 ảnh người mẫu","Xoá bớt nếu muốn thay ảnh khác."); return; }
  const {ok,bad}=await screenFiles(files);
  state.models.push(...ok.slice(0,room));
  if(ok.length) state.products.forEach(p=>stale(p,true));
  notice(bad.length?"Một số ảnh bị bỏ qua":"",bad.join(" "));
  if(ok.length) notify(`Đã thêm ${Math.min(ok.length,room)} ảnh người mẫu.`); render();
}

/* ------------------------------ navigation ------------------------------ */
function canEnter(n){
  if(n<=1) return true;
  if(n===2) return state.products.length>0;
  if(n===3) return !state.skipEvaluation&&state.products.length>0&&state.models.length>0;
  if(n===4) return state.products.some(p=>p.evaluation)||(state.skipEvaluation&&state.products.length>0&&!missingMappedModels());
  return !state.skipQc&&state.products.some(p=>p.outputs.length);
}
function go(n){ n=clamp(n,1,5); if(!canEnter(n)) return; state.step=n; render();
  $("#title").focus({preventScroll:true}); }

function renderSteps(){
  $("#steps").innerHTML=STEPS.map(s=>{
    const skipped=(s.n===3&&state.skipEvaluation)||(s.n===5&&state.skipQc);
    const cls=["step",s.n===state.step?"is-now":"",s.n<state.step?"is-past":"",skipped?"is-skip":""].filter(Boolean).join(" ");
    const slotCls=["step-slot",s.n===state.step?"is-now":"",s.n<state.step?"is-past":"",skipped?"is-skip":""].filter(Boolean).join(" ");
    let flag="";
    if(s.n===3&&state.analyzing) flag='<span class="flag">đang chạy</span>';
    if(s.n===4&&state.batchBusy) flag='<span class="flag">đang tạo</span>';
    if(s.n===4&&!state.batchBusy&&state.products.some(p=>p.error)) flag='<span class="flag">có lỗi</span>';
    const option=s.n===3
      ? `<button class="step-option ${state.skipEvaluation?"is-on":""}" id="skipEvaluation" data-act="toggle-skip-eval" aria-pressed="${state.skipEvaluation}">bỏ qua</button>`
      :s.n===5
        ? `<button class="step-option ${state.skipQc?"is-on":""}" id="skipQc" data-act="toggle-skip-qc" aria-pressed="${state.skipQc}">bỏ qua</button>`
        :"";
    return `<div class="${slotCls}">
      <span class="step-bar" aria-hidden="true"></span>
      <div class="step-line">
      <button class="${cls}" data-act="step" data-n="${s.n}" ${canEnter(s.n)?"":"disabled"}
        ${s.n===state.step?'aria-current="step"':""}>
        <span class="lab"><span class="n">${pad2(s.n)}</span><span class="t">${esc(s.label)}</span>${flag}</span>
      </button>${option}</div>
    </div>`;
  }).join("");
}

/* -------------------------------- step 03 ------------------------------- */
function render3(){
  if(!state.products.length){ $("#s3").innerHTML=`<p class="lede">Chưa có sản phẩm. Quay lại bước 01.</p>`; return; }
  const p=current();
  const rows=state.products.map(prod=>{
    const ev=prod.evaluation, sc=ev?Number(ev.compatibility?.final_score)||0:null;
    const b=sc==null?null:band(sc);
    const running=state.analyzing&&state.job===prod.id;
    return `<button class="pick" data-act="pick" data-id="${prod.id}" aria-current="${prod.id===p.id}">
      <img class="th" src="${objUrl(prod.files[0])}" alt="">
      <span class="col"><span class="nm">${esc(prod.name)}</span>
        <span class="gr">${running?"đang đánh giá…":b?esc(b.label):"chờ đánh giá"}</span></span>
      <span class="sc">${sc==null?"—":sc}</span></button>`;
  }).join("");

  const ev=p.evaluation;
  let right;
  if(!ev){
    right=`<p class="lede">${state.analyzing?"Đang đánh giá lần lượt từng sản phẩm.":"Chưa đánh giá sản phẩm này."}
      ${state.analyzing?'<span class="spin"></span>':""}</p>`;
  }else{
    const mq=Number(ev.input_quality?.model?.score)||0;
    const pq=Number(ev.input_quality?.product?.score)||0;
    const cs=Number(ev.compatibility?.final_score)||0;
    const cell=(k,v,warn)=>`<div class="scorecell"><span class="k">${k}</span>
      <span class="v">${v}<small>/100</small></span><span class="n ${warn?"is-warn":""}">${band(v).label}</span></div>`;
    const notes=[];
    (ev.risks||[]).slice(0,4).forEach(r=>notes.push(r.reason||r.factor));
    if(ev.compatibility?.score_cap_reason) notes.push(ev.compatibility.score_cap_reason);
    (ev.recommended_reference_requirements||[]).slice(0,2).forEach(r=>notes.push(r));
    if(!notes.length) notes.push("Không phát hiện rủi ro đáng kể.");
    // Every model image was scored — show them all so the choice stays the user's.
    const cands=(p.candidates||[]).slice().sort((a,b)=>a.index-b.index);
    const chosen=p.selectedModel??0;
    const grid=cands.map(c=>{
      const f=state.models[c.index]; if(!f) return "";
      const sc=Number(c.evaluation?.compatibility?.final_score)||0;
      const b=band(sc);
      const isAi=c.index===p.aiPick, isOn=c.index===chosen;
      return `<button class="cand ${isOn?"is-on":""}" data-act="use-model" data-id="${p.id}" data-i="${c.index}">
        <span class="shot"><img src="${objUrl(f)}" alt="Ảnh mẫu ${c.index+1}"></span>
        <span class="cl"><span class="nm">Mẫu ${pad2(c.index+1)}</span><span class="sc">${sc}</span></span>
        <span class="gr">${esc(b.label)}${isAi?" · Đề xuất":""}</span>
      </button>`;
    }).join("");
    right=`<div class="detail3">
      <div class="scores">
        ${cell("Ảnh người mẫu",mq,mq<82)}
        ${cell("Ảnh sản phẩm",pq,pq<85)}
        ${cell("Mức tương thích",cs,cs<82)}
      </div>
      <div class="cand-block">
        <div class="cand-head">
          <span class="eyebrow">Chọn người mẫu</span>
        </div>
        <div class="cand-row">${grid}</div>
      </div>
      <div class="notes scrollY">
        <span class="eyebrow">Nhận xét · mẫu ${pad2(chosen+1)}</span>
        ${notes.map(n=>`<p>${esc(n)}</p>`).join("")}
        <button class="link" style="align-self:flex-start" data-act="recheck" data-id="${p.id}"
          ${state.analyzing?"disabled":""}>Đánh giá lại sản phẩm này</button>
      </div></div>`;
  }
  $("#s3").innerHTML=`<div class="split3"><div class="pick-list scrollY">${rows}</div>${right}</div>`;
}

/* -------------------------------- step 04 ------------------------------- */
const STATUS={waiting:["Chờ tạo",""],rendering:["Đang tạo","run"],qc:["Chờ duyệt","ok"],
  done:["Đã tạo","ok"],approved:["Đã duyệt","ok"],failed:["Có lỗi","fail"]};
function statusOf(p){ if(p.error) return "failed"; if(p.status==="rendering") return "rendering";
  if(p.status==="approved") return "approved"; if(p.status==="done") return "done"; if(p.outputs.length) return "qc"; return "waiting"; }

function render4(){
  if(!state.products.length){ $("#s4").innerHTML=`<p class="lede">Chưa có sản phẩm. Quay lại bước 01.</p>`; return; }
  const p=current(), st=statusOf(p), out=p.outputs[p.selectedOutput];
  const rows=state.products.map((prod,i)=>{
    const s=statusOf(prod), [txt,cls]=STATUS[s];
    return `<button class="qitem" data-act="pick" data-id="${prod.id}" aria-current="${prod.id===p.id}">
      <img class="th" src="${objUrl(prod.files[0])}" alt="">
      <span class="col" style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span class="nm">${pad2(i+1)} · ${esc(prod.name)}</span>
        <span class="st ${cls}">${s==="rendering"?'<span class="spin"></span> ':""}${txt}${prod.outputs.length?` · V${prod.selectedOutput+1}`:""}</span>
      </span></button>`;
  }).join("");

  let over="";
  if(st==="rendering") over=`<div class="over"><span class="spin"></span><b>Đang tạo ảnh</b>
    <span>${esc(p.name)}${eta(1,"render")?` · thường mất ${eta(1,"render")}`:""}</span></div>`;
  else if(st==="failed"){
    const blocked=p.errorCode==="moderation_blocked";
    over=`<div class="over"><b>${blocked?"Dịch vụ tạo ảnh đã chặn":"Không tạo được"}</b><span>${esc(p.error||"")}</span>
      ${blocked?`<div class="pair"><button class="link" data-act="step" data-n="2">Ảnh người mẫu</button>
        <button class="link" data-act="step" data-n="1">Ảnh sản phẩm</button></div>`
        :p.retryable!==false?`<button class="link" data-act="retry" data-id="${p.id}">Thử lại</button>`:""}</div>`;
  }
  else if(!out) over=`<div class="over"><b>Chờ đến lượt</b><span>Sản phẩm này chưa được tạo.</span></div>`;

  const meta=[["Trạng thái",STATUS[st][0]],["Góc sản phẩm",String(p.files.length)],
    ["Người mẫu","Mẫu "+pad2(mappedModelIndex(p)+1)],
    ["Phiên bản",p.outputs.length?`${p.selectedOutput+1}/${MAX_VERSIONS}`:`0/${MAX_VERSIONS}`]];

  $("#s4").innerHTML=`<div class="split4">
    <div class="queue scrollY">${rows}</div>
    <div class="canvas"><div class="frame">
      ${out?`<img src="${out.image}" alt="Kết quả của ${esc(p.name)}">`:""}
      ${over}
    </div></div>
    <aside class="meta-col">
      <h2>${esc(p.name)}</h2>
      ${meta.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("")}
      ${out?.savedPath?`<div class="kv"><span class="k">Lưu tự động</span><span class="v">✓</span></div>`:""}
      <button class="link" style="margin-top:auto;align-self:flex-start" data-act="regen" data-id="${p.id}"
        ${out&&!state.batchBusy&&p.outputs.length<MAX_VERSIONS?"":"disabled"}>Tạo lại (${Math.max(0,MAX_VERSIONS-p.outputs.length)})</button>
    </aside></div>`;
}

        <button class="solid" data-act="approve" data-id="${p.id}" ${state.batchBusy||p.status==="approved"?"disabled":""}>${p.status==="approved"?"Đã duyệt":"Duyệt ảnh"}</button>
        <div class="pair">
          <button class="link" data-act="regen" data-id="${p.id}" ${!state.batchBusy&&left>0?"":"disabled"}>Tạo lại (${left})</button>
          <button class="link" data-act="download" data-id="${p.id}">Tải bản này</button>
          <button class="link" data-act="copy" data-id="${p.id}" ${out.savedPath?"":"disabled"}>Chép đường dẫn</button>
        </div>
      </div>
    </aside></div>`;
}

/* ------------------------------ head + foot ----------------------------- */
function renderHead(){
  const s=STEPS[state.step-1];
  $("#title").textContent=state.step===2&&state.skipEvaluation?"Ghép sản phẩm với người mẫu":s.title;
  $("#lede").textContent=state.step===2&&state.skipEvaluation
    ? "Mỗi sản phẩm dùng ảnh mẫu có cùng số thứ tự."
    :s.lede;
  const done=state.products.filter(p=>p.evaluation).length;
  const made=state.products.filter(p=>p.outputs.length).length;
  const ok=state.products.filter(p=>p.status==="approved").length;
  const map={1:[`${state.products.length}/${MAX_PRODUCTS}`,"sản phẩm"],
             2:[`${state.models.length}/${MAX_MODELS}`,"ảnh mẫu"],
             3:[`${done}/${state.products.length}`,"đã đánh giá"],
             4:[`${made}/${state.products.length}`,"hoàn tất"],
             5:[`${ok}/${state.products.length}`,"đã duyệt"]};
  $("#countA").textContent=map[state.step][0];
  $("#countB").textContent=map[state.step][1];
}

function renderFoot(){
  const note=$("#footNote"), back=$("#backBtn"), next=$("#nextBtn");
  const busy=state.analyzing?"Đang đánh giá đầu vào.":state.batchBusy?"Đang tạo ảnh.":"";
  back.style.visibility=state.step===1?"hidden":"visible";
  back.textContent="← "+(STEPS[state.step-2]?.label||"Quay lại");
  back.disabled=Boolean(busy);
  back.onclick=()=>go(state.step-1);
  next.disabled=Boolean(busy);
  next.title=busy||"";

  if(state.step===1){
    note.textContent=state.products.length?"Sẵn sàng sang bước người mẫu.":"Bắt đầu bằng ảnh sản phẩm.";
    next.textContent="Ảnh người mẫu →"; next.disabled=!state.products.length; next.onclick=()=>go(2); return;
  }
  if(state.step===2){
    const missingModels=missingMappedModels();
    const failed=failedQueue().length;
    const made=state.products.filter(p=>p.outputs.length).length;
    note.innerHTML=!state.models.length?"Cần ít nhất một ảnh người mẫu."
      :missingModels?`Cần thêm <b>${missingModels}</b> ảnh mẫu để ghép 1–1 với ${state.products.length} sản phẩm.`
      :state.skipEvaluation?failed?`<b>${failed}</b> lỗi cũ sẽ được thử lại${made?` · ${made} sản phẩm đã có ảnh`:""}.`
        :made?`<b>${made}</b> sản phẩm đã có ảnh — chỉ tạo phần còn thiếu.`
          :`Đủ ảnh để tạo${state.skipQc?" · không chạy QC":""}.`
      :`<b>${state.models.length}</b> ảnh mẫu dùng chung cho ${state.products.length} sản phẩm${state.skipQc?" · không chạy QC":""}.`;
    const pend=state.skipEvaluation?[]:state.products.filter(p=>!p.evaluation);
    const toRender=renderQueue().length;
    next.textContent=missingModels?`Cần thêm ${missingModels} ảnh mẫu →`
      :pend.length?`Đánh giá ${pend.length} sản phẩm →`:toRender?`Tạo ${toRender} sản phẩm →`
        :state.skipQc&&made?`Tải ${made} ảnh →`:"QC →";
    next.disabled=!state.models.length||!state.products.length||Boolean(missingModels)
      ||((pend.length||toRender)&&!state.apiReady)||(!pend.length&&!toRender&&!made);
    next.onclick=pend.length?()=>runAnalysis(pend):toRender?runBatch:state.skipQc?downloadAllOutputs:()=>go(5); return;
  }
  if(state.step===3){
    const pend=state.products.filter(p=>!p.evaluation);
    const units=pend.length*Math.max(1,state.models.length);
    note.innerHTML=state.analyzing
      ? `<span class="spin"></span> Đang đánh giá lần lượt.${eta(units,"eval")?` Còn ${eta(units,"eval")}.`:""}`
      : pend.length?`<b>${pend.length}</b> sản phẩm chưa đánh giá.${eta(units,"eval")?` Khoảng ${eta(units,"eval")}.`:""}`
                   :`Đã đánh giá xong. Sẵn sàng tạo ảnh.`;
    const toRender=renderQueue().length;
    next.textContent=pend.length?`Đánh giá ${pend.length} sản phẩm →`:toRender?`Tạo ${toRender} sản phẩm →`:"QC →";
    next.disabled=Boolean(busy)||!state.apiReady||!state.products.length;
    next.onclick=pend.length?()=>runAnalysis(pend):toRender?runBatch:()=>go(5); return;
  }
  if(state.step===4){
    const pend=renderQueue();
    const made=state.products.filter(p=>p.outputs.length).length;
    const failed=failedQueue().length;
    note.innerHTML=state.batchBusy
      ? `<span class="spin"></span> Đang tạo từng sản phẩm.${eta(pend.length,"render")?` Còn ${eta(pend.length,"render")}.`:""}`
      : pend.length?`<b>${pend.length}</b> sản phẩm chưa có ảnh.${eta(pend.length,"render")?` Khoảng ${eta(pend.length,"render")}.`:""}${failed?` ${failed} lỗi cũ sẽ được thử lại.`:""}`
                   :made?`<b>${made}</b> sản phẩm đã có ảnh.${state.skipQc?" Không chạy QC.":""}`
                        :"Chưa có sản phẩm để tạo.";
    next.textContent=pend.length?`Tạo ${pend.length} sản phẩm →`:made
      ?state.skipQc?`Tải ${made} ảnh →`:"QC →":"Chưa có ảnh";
    next.disabled=Boolean(busy)||(pend.length>0&&!state.apiReady)||!state.products.length||(!pend.length&&!made);
    next.onclick=pend.length?runBatch:made?state.skipQc?downloadAllOutputs:()=>go(5):null; return;
  }
  const ok=state.products.filter(p=>p.status==="approved").length;
  note.textContent="";
  next.textContent=ok?`Tải ${ok} ảnh đã duyệt →`:"Chưa có ảnh duyệt";
  next.disabled=!ok||Boolean(busy);
  next.onclick=downloadApproved;
}

function render(){
  renderSteps(); renderHead();
  $$(".screen").forEach((el,i)=>el.classList.toggle("is-on",i+1===state.step));
  if(state.step===1) render1(); if(state.step===2) render2(); if(state.step===3) render3();
  if(state.step===4) render4(); if(state.step===5) render5();
  renderFoot();
  const reset=$("#resetBtn");
  if(reset){ reset.disabled=!state.products.length||state.analyzing||state.batchBusy; }
  persist();
}

/* --------------------------- session persistence ------------------------- */
/* IndexedDB, not localStorage: structured clone stores the uploaded File
   objects as-is, so a reload restores the whole session — and there is no 5 MB
   ceiling to trip over once a few 2 MB renders pile up. */
const DB_NAME="studio-flow", DB_STORE="session", DB_KEY="current";
let dbPromise=null;
function idb(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((res,rej)=>{
    const rq=indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore(DB_STORE);
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
  return dbPromise;
}
function idbTx(mode,fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,mode), store=tx.objectStore(DB_STORE);
    const out=fn(store);
    tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);
    tx.onerror=()=>rej(tx.error);
  }));
}
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    // "rendering" is a transient state; storing it would restore into a stuck spinner.
    const products=state.products.map(p=>({...p,status:p.status==="rendering"?(p.outputs.length?(state.skipQc?"done":"qc"):"idle"):p.status}));
    idbTx("readwrite",s=>s.put({v:5,savedAt:Date.now(),seq,step:state.step,active:state.active,
      skipEvaluation:state.skipEvaluation,skipQc:state.skipQc,
      models:state.models,products},DB_KEY)).catch(()=>{});
  },600);
}

async function restore(){
  let saved;
  try{ saved=await idbTx("readonly",s=>s.get(DB_KEY)); }catch{ return false; }
  if(!saved||!Array.isArray(saved.products)||!saved.products.length) return false;
  seq=saved.seq||saved.products.length;
  state.models=saved.models||[];
  state.skipEvaluation=saved.skipEvaluation===true;
  state.skipQc=saved.skipQc===true;
  const refreshMixedDirectBatch=Number(saved.v||1)<5&&state.skipEvaluation
    &&saved.products.some(p=>p.outputs?.length)&&saved.products.some(p=>!p.outputs?.length);
  state.products=saved.products.map((p,index)=>{
    // v4 changes direct rendering from "every product uses Model 01" to index-to-index mapping.
    // Errors on products after the first came from a different model and are stale.
    const oldDirectMapping=Number(saved.v||1)<4&&state.skipEvaluation&&index>0&&!p.outputs?.length;
    const obsoleteGate=refreshMixedDirectBatch||oldDirectMapping||["sensitive_apparel_input","evaluation_refresh_required","adult_confirmation_required"].includes(p.errorCode);
    return {...p,error:obsoleteGate?null:p.error||null,errorCode:obsoleteGate?null:p.errorCode||null,
      retryable:obsoleteGate?true:p.retryable!==false,
      evaluationSkipped:p.evaluationSkipped===true,
      outputs:refreshMixedDirectBatch?[]:p.outputs||[],selectedOutput:refreshMixedDirectBatch?0:p.selectedOutput||0,
      lastQc:refreshMixedDirectBatch?null:p.lastQc||null,
      status:refreshMixedDirectBatch?"idle":p.status==="rendering"?(p.outputs?.length?(state.skipQc?"done":"qc"):"idle"):p.status};
  });
  state.active=saved.active||state.products[0]?.id||null;
  state.step=clamp(saved.step||1,1,5);
  if(state.skipEvaluation&&state.step===3) state.step=2;
  if(state.skipQc&&state.step===5) state.step=4;
  render();
  const mins=Math.round((Date.now()-(saved.savedAt||Date.now()))/60000);
  notify(`Đã khôi phục lượt làm dở${mins>0?` từ ${mins} phút trước`:""}.`);
  return true;
}

function resetBatch(){
  if(!state.products.length) return;
  const n=state.products.length;
  if(!confirm(`Xoá ${n} sản phẩm cùng toàn bộ ảnh đã tạo trong lượt này?\n\nẢnh người mẫu được giữ lại. Ảnh đã lưu trên đĩa không bị xoá.`)) return;
  state.products.forEach(p=>p.files.forEach(releaseFile));
  state.products=[]; state.active=null; state.step=1; seq=0;
  idbTx("readwrite",s=>s.delete(DB_KEY)).catch(()=>{});
  notify("Đã bắt đầu lượt mới. Bộ ảnh người mẫu vẫn giữ nguyên.");
  render();
}

/* ---------------------------------- API --------------------------------- */
async function api(path,payload){
  let res;
  try{
    res=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
  }catch(cause){
    const error=new Error("Mất kết nối tới Studio Flow trong lúc xử lý. Kiểm tra server rồi thử lại.");
    error.code="network_error"; error.retryable=true; error.cause=cause; throw error;
  }
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    const error=new Error(data.error||`Máy chủ trả lỗi ${res.status}.`);
    error.code=data.code||null;
    error.retryable=typeof data.retryable==="boolean"?data.retryable:(res.status===429||res.status>=500);
    throw error;
  }
  return data;
}

async function runAnalysis(targets){
  if(state.analyzing||state.batchBusy) return;
  if(!state.apiReady){ notice("Chưa kết nối được dịch vụ",connFix()); return; }
  const list=(targets&&targets.length?targets:state.products).filter(Boolean);
  if(!list.length) return;
  state.analyzing=true; notice(""); state.step=3; render();
  announce(`Bắt đầu đánh giá ${list.length} sản phẩm.`);
  for(const p of list){
    state.job=p.id; state.active=p.id; render();
    try{
      const [productImages,modelImages]=await Promise.all([
        Promise.all(p.files.map(asDataUrl)), Promise.all(state.models.map(asDataUrl))]);
      const data=await api("/api/evaluate",{productImages,modelImages});
      p.candidates=data.candidates||[];
      const best=p.candidates.find(c=>c.index===data.recommended_index)||p.candidates[0];
      if(!best) throw new Error("Không nhận được kết quả đánh giá.");
      p.selectedModel=best.index; p.evaluation=best.evaluation; p.aiPick=best.index;
      p.evaluationSkipped=false;
      clearProductError(p);
    }catch(err){
      state.analyzing=false; state.job=""; notice(`Không đánh giá được ${p.name}`,err.message); render(); return;
    }
  }
  state.analyzing=false; state.job=""; render(); notify("Đã đánh giá xong toàn bộ sản phẩm.");
}

async function generateOne(p,isRerender){
  const skipEvaluation=state.skipEvaluation||p.evaluationSkipped===true;
  const mi=mappedModelIndex(p);
  if(skipEvaluation){ p.evaluationSkipped=true; p.selectedModel=mi; }
  const mf=state.models[mi];
  if(!mf) throw new Error(`Thiếu Mẫu ${pad2(mi+1)} để ghép với sản phẩm này.`);
  const attempt=p.outputs.length+1;
  const [modelImage,productImages]=await Promise.all([asDataUrl(mf),Promise.all(p.files.map(asDataUrl))]);
  const reasons=isRerender?((p.lastQc&&(p.lastQc.rerender_reasons||p.lastQc.critical_failure_reasons))||[]):[];
  // What the last QC judged correct travels with the retry so it does not get undone.
  const keep=isRerender?((p.lastQc&&p.lastQc.strengths)||[]):[];
  const out=await api("/api/render",{modelImage,productImages,evaluation:skipEvaluation?null:p.evaluation,
    skipEvaluation,manualOverride:skipEvaluation||!(p.evaluation?.compatibility?.decision==="AUTO_RENDER"),
    productId:p.name,quality:"medium",size:"1024x1536",
    attempt,rerenderReasons:reasons,rerenderKeep:keep});
  p.outputs.push({image:out.imageUrl||out.image,filename:out.filename,savedPath:out.savedPath,qc:null,modelIndex:mi,
    qcSkipped:state.skipQc,evaluationSkipped:skipEvaluation});
  p.selectedOutput=p.outputs.length-1; p.status=state.skipQc?"done":"qc"; p.lastQc=null; clearProductError(p); render();
  if(state.skipQc) return;
  try{
    const qc=await api("/api/qc",{modelImage,productImages,generatedFilename:out.filename});
    p.lastQc=qc; p.outputs[p.selectedOutput].qc=qc;
  }catch(err){ const fb={error:err.message,decision:"MANUAL"}; p.lastQc=fb; p.outputs[p.selectedOutput].qc=fb; }
  render();
}

async function runBatch(){
  if(state.batchBusy||state.analyzing) return;
  if(!state.apiReady){ notice("Chưa kết nối được dịch vụ",connFix()); return; }
  const missingModels=missingMappedModels();
  if(missingModels){ notice("Chưa đủ ảnh mẫu",`Cần thêm ${missingModels} ảnh để ghép 1–1 với sản phẩm.`); return; }
  const pend=renderQueue();
  if(!pend.length){ if(!state.skipQc) go(5); return; }
  state.batchBusy=true; notice(""); state.step=4; render();
  let created=0;
  for(const p of pend){
    if(p.error) clearProductError(p);
    state.active=p.id; p.status="rendering"; render();
    try{ await generateOne(p,false); created+=1; }
    catch(err){ p.status="idle"; setProductError(p,err); render(); }   // one failure never discards earlier work
  }
  state.batchBusy=false;
  const bad=state.products.filter(p=>p.error);
  render();
  if(bad.length) notice(`${bad.length} sản phẩm chưa tạo được`,"Xem chi tiết tại bước Tạo ảnh.");
  notify(created?`Đã tạo ${created} sản phẩm.`:"Chưa tạo được sản phẩm nào.");
  if(!bad.length&&!state.skipQc) go(5);
}

async function regenerate(p){
  if(state.batchBusy||state.analyzing) return;
  if(p.outputs.length>=MAX_VERSIONS){ toast("Đã dùng hết 3 lần tạo lại."); return; }
  state.batchBusy=true; p.status="rendering"; render();
  announce(`Đang tạo lại ${p.name}, bản ${p.outputs.length+1} trên ${MAX_VERSIONS}.`);
  try{ await generateOne(p,true); notify(`Đã tạo bản V${p.outputs.length} cho ${p.name}.`); }
  catch(err){ setProductError(p,err); notice(`Không tạo lại được ${p.name}`,err.message); }
  finally{ state.batchBusy=false; if(p.status==="rendering") p.status=p.outputs.length?(state.skipQc?"done":"qc"):"idle"; render(); }
}

function downloadOutput(out,fallbackName){
  if(!out) return;
  const a=document.createElement("a"); a.href=out.image; a.download=out.filename||`${fallbackName}.png`;
  document.body.appendChild(a); a.click(); a.remove();
}
function saveOne(p,approve){
  const out=p.outputs[p.selectedOutput]; if(!out) return;
  if(!approve){ downloadOutput(out,p.name); return; }
  p.status="approved";
  const ready=state.products.filter(item=>item.outputs.length);
  const index=ready.findIndex(item=>item.id===p.id);
  const ordered=index<0?ready:[...ready.slice(index+1),...ready.slice(0,index)];
  const next=ordered.find(item=>item.status!=="approved");
  if(next) state.active=next.id;
  notify(next?`Đã duyệt ${p.name}. Chuyển sang ảnh tiếp theo.`:`Đã duyệt ${p.name}.`);
  render();
}
function downloadProducts(list,label){
  if(!list.length) return;
  list.forEach((p,i)=>setTimeout(()=>{ const out=p.outputs[p.selectedOutput];
    downloadOutput(out,p.name); },i*350));
  notify(`Đang tải ${list.length} ${label}.`);
}
function downloadAllOutputs(){
  downloadProducts(state.products.filter(p=>p.outputs[p.selectedOutput]),"ảnh đã tạo");
}
function downloadApproved(){
  downloadProducts(state.products.filter(p=>p.status==="approved"&&p.outputs[p.selectedOutput]),"ảnh đã duyệt");
}

/* -------------------------------- events -------------------------------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el||el.disabled) return;
  const act=el.dataset.act, p=el.dataset.id?byId(el.dataset.id):current();
  if(act==="reset") return resetBatch();
  if(act==="step") return go(Number(el.dataset.n));
  if(act==="toggle-skip-eval"){
    state.skipEvaluation=!state.skipEvaluation;
    state.products.forEach(prod=>stale(prod,true));
    if(state.skipEvaluation&&state.step===3) state.step=2;
    return render();
  }
  if(act==="toggle-skip-qc"){
    state.skipQc=!state.skipQc;
    if(state.skipQc&&state.step===5) state.step=4;
    state.products.forEach(prod=>{
      if(!prod.outputs.length||prod.status==="approved") return;
      if(state.skipQc&&prod.status==="qc") prod.status="done";
      if(!state.skipQc&&prod.status==="done") prod.status="qc";
    });
    return render();
  }
  if(act==="pick"){ state.active=el.dataset.id; return render(); }
  if(act==="pick-product"){ viewTarget=null; return $("#fProduct").click(); }
  if(act==="add-view"){ viewTarget=el.dataset.id; return $("#fView").click(); }
  if(act==="replace"){ viewTarget="main:"+el.dataset.id; return $("#fView").click(); }
  if(act==="pick-model") return $("#fModel").click();
  if(act==="rm-product"){ if(!p) return;
    const removedIndex=state.products.findIndex(item=>item.id===p.id);
    p.files.forEach(releaseFile);
    state.products=state.products.filter(x=>x.id!==p.id);
    if(state.skipEvaluation) state.products.slice(Math.max(0,removedIndex)).forEach(item=>stale(item,true));
    if(state.active===p.id) state.active=state.products[0]?.id||null;
    notify(`Đã xoá ${p.name}.`); return render(); }
  if(act==="rm-view"){ if(!p) return; const [removed]=p.files.splice(Number(el.dataset.i),1); releaseFile(removed); stale(p,true); return render(); }
  if(act==="rm-model"){ const [removed]=state.models.splice(Number(el.dataset.i),1); releaseFile(removed); state.products.forEach(p=>stale(p,true)); return render(); }
  if(act==="zoom"){ $("#lightImg").src=el.dataset.src; $("#lightTitle").textContent=el.dataset.title||"Xem ảnh";
    return $("#light").showModal(); }
  if(act==="use-model"){
    if(!p) return;
    const idx=Number(el.dataset.i);
    const c=(p.candidates||[]).find(x=>x.index===idx);
    if(!c) return;
    // Scores are per model×product pair, so swap the evaluation with the model.
    p.selectedModel=idx; p.evaluation=c.evaluation; clearProductError(p);
    notify(idx===p.aiPick?`Đang dùng Mẫu ${pad2(idx+1)}.`:`Đã chọn Mẫu ${pad2(idx+1)}.`);
    return render();
  }
  if(act==="recheck"){ if(p){ stale(p); render(); return runAnalysis([p]); } return; }
  if(act==="retry"){ if(p){ if(p.retryable===false) return toast("Hãy đổi ảnh đầu vào trước khi thử lại."); clearProductError(p); render(); return regenerate(p); } return; }
  if(act==="version"){ if(p){ p.selectedOutput=Number(el.dataset.i);
    p.lastQc=p.outputs[p.selectedOutput]?.qc||p.lastQc; return render(); } return; }
  if(act==="approve"){ if(p) return saveOne(p,true); return; }
  if(act==="download"){ if(p) return saveOne(p,false); return; }
  if(act==="regen"){ if(p) return regenerate(p); return; }
  if(act==="copy"){ const out=p?.outputs[p.selectedOutput]; if(!out?.savedPath) return;
    try{ await navigator.clipboard.writeText(out.savedPath); notify("Đã chép đường dẫn."); }
    catch{ toast(out.savedPath); } }
});

document.addEventListener("keydown",e=>{
  if(/input|textarea/i.test(e.target.tagName)) return;
  if($("#light").open) return;
  if(e.target.closest?.("#compare")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){
    e.preventDefault();
    state.split=clamp(state.split+(e.key==="ArrowRight"?2:-2),0,100);
    applySplit();
    return;
  }
  if(e.key==="ArrowRight") return go(state.step+1);
  if(e.key==="ArrowLeft") return go(state.step-1);
  if(/^[1-5]$/.test(e.key)) return go(Number(e.key));
});

/* split drag */
function setSplit(e){
  const box=$("#compare"); if(!box) return;
  const r=box.getBoundingClientRect();
  state.split=clamp(((e.clientX-r.left)/r.width)*100,0,100);
  applySplit();
}
function applySplit(){
  $("#layerSrc")?.style.setProperty("--clip",(100-state.split)+"%");
  if($("#hLine")) $("#hLine").style.left=state.split+"%";
  if($("#splitValue")) $("#splitValue").textContent=`${Math.round(state.split)}%`;
  $("#compare")?.setAttribute("aria-valuenow",String(Math.round(state.split)));
}
document.addEventListener("pointerdown",e=>{
  const box=e.target.closest("#compare"); if(!box) return;
  state.dragging=true; box.setPointerCapture?.(e.pointerId); setSplit(e);
});
document.addEventListener("pointermove",e=>{ if(state.dragging) setSplit(e); });
document.addEventListener("pointerup",()=>{ state.dragging=false; });

$("#fProduct").addEventListener("change",async e=>{ const f=[...e.target.files]; e.target.value=""; if(f.length) await addProducts(f); });
$("#fModel").addEventListener("change",async e=>{ const f=[...e.target.files]; e.target.value=""; if(f.length) await addModels(f); });
$("#fView").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  if(String(viewTarget).startsWith("main:")){
    const p=byId(viewTarget.slice(5));
    if(p){ const {ok,bad}=await screenFiles(files);
      if(ok[0]){ releaseFile(p.files[0]); p.files[0]=ok[0]; stale(p,true); notify("Đã thay ảnh chính."); }
      notice(bad.length?"Ảnh không hợp lệ":"",bad.join(" ")); render(); }
  }else{ const p=byId(viewTarget); if(p) await addViews(p,files); }
  viewTarget=null;
});

["dragenter","dragover"].forEach(t=>document.addEventListener(t,e=>{
  if(e.dataTransfer?.types?.includes("Files")) e.preventDefault(); }));
document.addEventListener("drop",async e=>{
  if(!e.dataTransfer?.files?.length) return;
  e.preventDefault();
  const files=[...e.dataTransfer.files];
  if(state.step===1) await addProducts(files); else if(state.step===2) await addModels(files);
});

/* ----------------------------- server status ---------------------------- */
const onCodex=()=>state.backend==="codex";
const connFix=()=>onCodex()
  ? "Mở PowerShell chạy codex login rồi khởi động lại Studio Flow."
  : "Khởi động lại server kèm API key rồi thử lại.";

function renderConn(){
  const box=$("#conn"), t=$("#connText");
  box.className=`conn ${state.apiReady?"is-ok":"is-error"}`;
  t.textContent=state.apiReady?"Đã kết nối":state.connMessage;
  box.title=state.apiReady
    ?(onCodex()?"Dùng hạn mức ChatGPT; không trừ số dư API.":"Dùng OpenAI API và tính phí theo lượt.")
    :`${state.connMessage} ${connFix()}`;
}
async function checkServer(){
  const was=state.apiReady;
  try{
    const res=await fetch("/api/status",{cache:"no-store"});
    const d=await res.json();
    state.apiReady=Boolean(d.ready); state.backend=d.backend||"api";
    state.apiModel=d.model||"gpt-image-2";
    state.connMessage=state.apiReady?"":(onCodex()?"dịch vụ chưa sẵn sàng":"chưa có API key trên máy chủ");
  }catch{ state.apiReady=false; state.connMessage="chưa kết nối được máy chủ"; }
  renderConn();
  if(!state.analyzing&&!state.batchBusy){ renderFoot();
    if(was!==state.apiReady) announce(state.apiReady?"Đã kết nối dịch vụ.":`Mất kết nối: ${state.connMessage}`); }
}

/* ---------------------------------- boot -------------------------------- */
renderConn(); render(); checkServer(); setInterval(checkServer,20000);
restore().catch(()=>{});

</script>
