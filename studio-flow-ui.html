<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Playfair Display, not Instrument Serif: the latter ships no Vietnamese subset,
     so ầ/ề/ố split into base letter + floating accent. Same editorial voice, full diacritics. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Studio Flow — editorial production tool.
   Serif for voice, grotesque for work, mono for numbers. No cards, no chrome:
   the garment photography is the only thing allowed to carry weight.
   ========================================================================== */
:root{
  --ink:#1a1a1c;
  --ink-2:#5c5c57;
  --ink-3:#6f6f69;
  --ink-4:#84847e;
  --ink-5:#8f8f88;
  --ink-6:#a9a9a2;
  --ink-7:#b0afa8;
  --ink-8:#c2c1ba;
  --line:#ececea;
  --line-2:#eeedea;
  --wash:#f4f4f1;
  --wash-2:#fafaf9;
  --sage:#7d9482;
  --sage-ink:#6f7a6e;
  --clay:#9c6b52;
  --swatch:repeating-linear-gradient(45deg,#f1f0ed 0 7px,#f9f9f7 7px 14px);
  --serif:"Playfair Display",ui-serif,Georgia,"Times New Roman",serif;
  --sans:"Geist","Segoe UI Variable Text","Helvetica Neue",Helvetica,ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  --gap:clamp(16px,2.6vw,44px);
  --pad-x:clamp(14px,2.4vw,44px);
  --max:1360px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px}
h1,h2,p,figure{margin:0}
button,input{font:inherit;color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
h1:focus,h1:focus-visible,.pane:focus{outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid #fff}

.shell{height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 var(--pad-x);overflow:hidden}
.row{width:100%;max-width:var(--max)}

/* ------------------------------- header --------------------------------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(10px,1.6vh,20px) 0 clamp(8px,1vh,12px)}
.wordmark{font-family:var(--serif);font-size:20px;letter-spacing:-.01em}
.top-right{display:flex;align-items:center;gap:16px}
.keyhint{font-family:var(--mono);font-size:11.5px;color:var(--ink-7)}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-5);white-space:nowrap}
.conn .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-8)}
.conn.is-ok .dot{background:var(--sage)}
.conn.is-error .dot{background:var(--clay)}
.conn.is-error{color:var(--clay)}

/* -------------------------------- steps --------------------------------- */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.2vw,18px);padding-bottom:clamp(10px,1.4vh,18px)}
.step{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:0;background:none;padding:0;cursor:pointer;text-align:left;min-width:0;font-family:inherit}
.step:disabled{cursor:not-allowed}
.step .bar{width:100%;height:2px;background:var(--line);transition:background .18s}
.step.is-past .bar,.step.is-now .bar{background:var(--ink)}
.step .lab{display:flex;align-items:baseline;gap:7px;min-width:0}
.step .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-8)}
.step .t{font-size:13px;font-weight:500;color:var(--ink-6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.is-now .n{color:var(--ink-5)}
.step.is-now .t{color:var(--ink)}
.step.is-past .t{color:var(--ink-2)}
.step:not(:disabled):hover .t{color:var(--ink)}
.step .flag{font-family:var(--mono);font-size:11.5px;color:var(--clay)}

/* -------------------------------- stage --------------------------------- */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.4vh,18px)}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
.title-box{display:flex;flex-direction:column;gap:4px;min-width:0}
h1{font-family:var(--serif);font-size:clamp(24px,2.6vw,38px);font-weight:400;letter-spacing:-.02em;line-height:1.05}
.lede{font-size:14px;color:var(--ink-4);line-height:1.45;max-width:64ch;text-wrap:pretty}
.count{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.count b{font-family:var(--serif);font-size:26px;font-weight:400}
.count span{font-size:12.5px;color:var(--ink-6)}
.screen{flex:1;min-height:0;display:none}
.screen.is-on{display:block}
.notice{font-size:12.5px;color:var(--clay);line-height:1.5;padding-bottom:6px}
.notice b{color:var(--ink);font-weight:500}

/* ------------------------------ primitives ------------------------------ */
.link{border:0;background:none;padding:0;font-family:inherit;font-size:12.5px;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--ink)}
.link:disabled{color:var(--ink-8);cursor:not-allowed;text-decoration:none}
.solid{border:0;background:var(--ink);color:#fff;padding:12px 24px;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.solid:hover:not(:disabled){background:#000}
.solid:disabled{background:var(--line);color:var(--ink-6);cursor:not-allowed}
.tile{aspect-ratio:4/5;border:1px solid var(--line-2);background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit}
.tile:hover{background:var(--wash-2)}
.tile .plus{font-family:var(--serif);font-size:26px;color:var(--ink-6);line-height:1}
.tile .t{font-size:13px}
.tile .s{font-family:var(--mono);font-size:11.5px;color:var(--ink-7)}
.swatch{background:var(--swatch);display:grid;place-items:center}
.swatch span{font-family:var(--mono);font-size:11.5px;color:#9c9b95}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-7)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-7)}
/* Instrument Serif ships Vietnamese diacritics in Regular but NOT in Italic —
   italic splits ế into e + ́. Keep the serif voice, drop the slant. */
.serif-note{font-family:var(--serif);font-style:normal;font-size:16px;color:var(--sage-ink);line-height:1.45}
.scrollY{min-height:0;overflow-y:auto;overflow-x:hidden}
.spin{width:10px;height:10px;border:1.5px solid var(--line);border-top-color:var(--ink-3);border-radius:50%;
  display:inline-block;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* ------------------------------- step 01 -------------------------------- */
/* Larger cells: the garment is the subject, and auto-fill at 178px left half
   the canvas empty on a studio monitor. */
.grid-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:clamp(16px,2vw,30px)}
.product{display:flex;flex-direction:column;gap:9px;min-width:0}
.product .shot{position:relative;aspect-ratio:4/5;background:var(--swatch);overflow:hidden}
.product .shot img{width:100%;height:100%;object-fit:cover}
.product .meta{display:flex;align-items:baseline;gap:8px;min-width:0}
.product .meta .code{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product .acts{display:flex;gap:14px;flex-wrap:wrap}
.views{display:flex;gap:6px;flex-wrap:wrap}
.view{position:relative;width:34px;height:43px;background:var(--swatch);overflow:hidden}
.view img{width:100%;height:100%;object-fit:cover}
.view button{position:absolute;inset:0;border:0;background:rgba(26,26,28,.62);color:#fff;font-size:11px;
  cursor:pointer;opacity:0;font-family:inherit}
.view:hover button,.view:focus-within button{opacity:1}

/* ------------------------------- step 02 -------------------------------- */
.split2{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(210px,22vw,306px);gap:var(--gap);min-height:0}
.grid-models{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:clamp(14px,1.8vw,24px)}
.model{display:flex;flex-direction:column;gap:8px;min-width:0}
.model .shot{position:relative;aspect-ratio:3/4;background:var(--swatch);overflow:hidden}
.model .shot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.model .shot .rm{position:absolute;top:6px;right:6px;border:0;background:rgba(26,26,28,.66);color:#fff;
  font-size:11px;width:22px;height:22px;cursor:pointer;opacity:0;font-family:inherit}
.model .shot:hover .rm,.model .shot:focus-within .rm{opacity:1}
.aside-col{display:flex;flex-direction:column;gap:16px;min-height:0}
.aside-col h2{font-family:var(--serif);font-size:19px;font-weight:400;line-height:1.2}
.tip{display:flex;flex-direction:column;gap:3px}
.tip b{font-size:13px;font-weight:500}
.tip span{font-size:12.5px;color:var(--ink-5);line-height:1.5;text-wrap:pretty}

/* ------------------------------- step 03 -------------------------------- */
.split3{height:100%;display:grid;grid-template-columns:clamp(150px,16vw,226px) minmax(0,1fr);gap:var(--gap);min-height:0}
.pick-list{display:flex;flex-direction:column;gap:4px;min-height:0}
.pick{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;
  background:none;padding:8px;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.pick:hover{background:#f7f7f5}
.pick[aria-current="true"]{background:var(--wash)}
.pick .th{width:38px;height:48px;background:var(--swatch);object-fit:cover}
.pick .col{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick .nm{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick[aria-current="true"] .nm{color:var(--ink)}
.pick .gr{font-family:var(--mono);font-size:11.5px;color:var(--ink-6)}
.pick .sc{font-family:var(--mono);font-size:12.5px;color:var(--ink-5)}
.detail3{min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px)}
/* Keep the three figures as a tight cluster; stretching them across the full
   column left each number stranded in its own empty field. */
.scores{display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap}
.scorecell{display:flex;flex-direction:column;gap:4px;min-width:0}
.scorecell .k{font-size:12.5px;color:var(--ink-5)}
.scorecell .v{font-family:var(--serif);font-size:clamp(28px,3vw,42px);line-height:1}
.scorecell .n{font-family:var(--mono);font-size:11.5px;color:var(--sage-ink)}
.scorecell .n.is-warn{color:var(--clay)}
.detail3-body{flex:1;min-height:0;display:grid;grid-template-columns:clamp(150px,17vw,236px) minmax(0,1fr);gap:var(--gap);align-content:start}
/* Model candidates — all scored options, so the pick never has to be AI's. */
.cand-block{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.cand-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cand-row{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding-bottom:4px}
.cand{flex:0 0 auto;width:118px;border:0;background:none;padding:6px;cursor:pointer;font-family:inherit;
  text-align:left;display:flex;flex-direction:column;gap:6px}
.cand:hover{background:#f7f7f5}
.cand.is-on{background:var(--wash)}
.cand .shot{display:block;aspect-ratio:3/4;background:var(--swatch);overflow:hidden}
.cand .shot img{width:100%;height:100%;object-fit:cover;opacity:.72;transition:opacity .12s}
.cand.is-on .shot img,.cand:hover .shot img{opacity:1}
.cand .cl{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.cand .nm{font-size:12.5px;color:var(--ink-2)}
.cand.is-on .nm{color:var(--ink)}
.cand .sc{font-family:var(--mono);font-size:12.5px;color:var(--ink-5)}
.cand.is-on .sc{color:var(--ink)}
/* Two-line box keeps every card the same height when one carries the AI badge. */
.cand .gr{font-family:var(--mono);font-size:11px;color:var(--ink-6);line-height:1.3;min-height:2.6em}
.cand .gr b{font-weight:400;color:var(--ink-3)}
.chosen{display:flex;flex-direction:column;gap:8px;min-width:0}
.chosen .shot{aspect-ratio:3/4;background:var(--swatch);overflow:hidden}
.chosen .shot img{width:100%;height:100%;object-fit:cover}
.chosen .line{display:flex;justify-content:space-between;font-size:12.5px}
.chosen .line b{font-family:var(--mono);font-weight:400;color:var(--ink-5)}
.notes{min-height:0;display:flex;flex-direction:column;gap:10px}
.notes p{font-size:13px;color:var(--ink-2);line-height:1.6;max-width:78ch;text-wrap:pretty}

/* ------------------------------- step 04 -------------------------------- */
.split4{height:100%;display:grid;grid-template-columns:clamp(150px,16vw,226px) minmax(0,1fr) clamp(186px,20vw,268px);
  gap:clamp(16px,2.4vw,40px);min-height:0}
.queue{display:flex;flex-direction:column;gap:4px;min-height:0}
.qitem{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;border:0;background:none;
  padding:8px;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.qitem:hover{background:#f7f7f5}
.qitem[aria-current="true"]{background:var(--wash)}
.qitem .th{width:38px;height:48px;background:var(--swatch);object-fit:cover}
.qitem .nm{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem[aria-current="true"] .nm{color:var(--ink)}
.qitem .st{font-family:var(--mono);font-size:11.5px;color:var(--ink-6)}
.qitem .st.run{color:var(--ink)}
.qitem .st.fail{color:var(--clay)}
.qitem .st.ok{color:var(--sage-ink)}
.canvas{min-height:0;min-width:0;display:grid;place-items:center}
.canvas .frame{height:100%;max-width:100%;aspect-ratio:3/4;background:var(--swatch);display:grid;place-items:center;position:relative;overflow:hidden}
.canvas .frame img{width:100%;height:100%;object-fit:contain}
.canvas .over{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;
  background:var(--swatch);padding:24px;text-align:center}
.canvas .over b{font-family:var(--serif);font-size:20px;font-weight:400}
.canvas .over span{font-size:12.5px;color:var(--ink-5);max-width:32ch;line-height:1.5}
.meta-col{display:flex;flex-direction:column;gap:13px;min-height:0}
.meta-col h2{font-family:var(--serif);font-size:18px;font-weight:400;line-height:1.25;overflow-wrap:anywhere}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.kv .k{font-size:12.5px;color:var(--ink-5)}
.kv .v{font-family:var(--mono);font-size:12.5px}

/* ------------------------------- step 05 -------------------------------- */
.split5{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(200px,21vw,284px);gap:var(--gap);min-height:0}
.qc-left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.qc-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;row-gap:8px}
.chips{display:flex;gap:6px;min-width:0;flex-wrap:wrap}
.chip{border:0;background:var(--wash);color:var(--ink-3);padding:6px 11px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
.chip[aria-current="true"]{background:var(--ink);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
/* The frame borrows the AI image's own aspect ratio, so the photo fills its
   height exactly — never cropped, never marooned in empty space. */
.compare-wrap{flex:1;min-height:0;min-width:0;display:grid;place-items:center}
.compare{height:100%;max-width:100%;aspect-ratio:var(--ar,2/3);position:relative;overflow:hidden;
  cursor:ew-resize;touch-action:none;background:var(--swatch)}
.layer{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.layer img{width:100%;height:100%;object-fit:contain;transform:scale(var(--z,1));transform-origin:var(--ox,50%) var(--oy,50%)}
/* Both layers stay full-size and perfectly registered; the top one is CLIPPED,
   never resized. Shrinking its box would rescale the photo inside it and the
   two images would no longer line up. */
.layer.top{background:#fff;width:100%;clip-path:inset(0 var(--clip,50%) 0 0)}
/* Tags sit over photography, so they carry their own scrim. */
.compare .tagL,.compare .tagR{position:absolute;top:12px;font-family:var(--mono);font-size:11.5px;
  white-space:nowrap;z-index:3;background:rgba(255,255,255,.82);padding:3px 7px;color:var(--ink)}
.compare .tagL{left:12px}
.compare .tagR{right:12px}
.handleLine{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);z-index:4}
.handleKnob{position:absolute;top:50%;width:30px;height:30px;margin-left:-15px;margin-top:-15px;border-radius:50%;
  background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;z-index:5}
/* Step 05 needs the same "working" signal step 04 has, or a 80s regenerate
   looks like a frozen screen and people reload — losing the whole session. */
.busy-veil{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:8px;
  background:rgba(255,255,255,.9);padding:24px;text-align:center}
.busy-veil b{font-family:var(--serif);font-size:20px;font-weight:400}
.busy-veil span{font-size:12.5px;color:var(--ink-5);max-width:34ch;line-height:1.5}
.qc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;row-gap:8px}
.vset{display:flex;gap:6px}
.vbtn{border:0;background:var(--wash);color:var(--ink-3);padding:5px 10px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.qc-right{display:flex;flex-direction:column;gap:13px;min-height:0}
.qc-score{display:flex;align-items:baseline;justify-content:space-between}
.qc-score .k{font-size:12.5px;color:var(--ink-5)}
.qc-score .v{font-family:var(--serif);font-size:32px;line-height:1}
.qc-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
.qc-list .kv .k{font-size:13px;color:var(--ink-2)}
.qc-list .kv .v{color:var(--ink-5)}
.qc-acts{display:flex;flex-direction:column;gap:8px}
.qc-acts .pair{display:flex;gap:16px}

/* ------------------------------- footer --------------------------------- */
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(10px,1.4vh,18px) 0 clamp(12px,1.8vh,22px)}
.foot .note{font-size:13px;color:var(--ink-5)}
.foot .note b{color:var(--ink);font-weight:500}
.foot .acts{display:flex;align-items:center;gap:18px}
.back{border:0;background:none;padding:0;font-family:inherit;font-size:13.5px;color:var(--ink-3);cursor:pointer}
.back:hover{color:var(--ink)}

/* -------------------------------- toast --------------------------------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);background:var(--ink);color:#fff;
  padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ------------------------------- lightbox ------------------------------- */
dialog.light{border:0;padding:0;background:none;max-width:min(92vw,1000px)}
dialog.light::backdrop{background:rgba(26,26,28,.6)}
.light-in{background:#fff;display:flex;flex-direction:column;max-height:90vh}
.light-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.light-hd strong{font-size:13px;font-weight:500}
.light-bd{min-height:0;overflow:auto;background:var(--wash-2)}
.light-bd img{width:100%;height:auto;max-height:76vh;object-fit:contain}

/* ------------------------------ responsive ------------------------------ */
@media (max-width:1080px){
  .split4{grid-template-columns:clamp(140px,18vw,200px) minmax(0,1fr);grid-template-areas:"q c" "m m"}
  .queue{grid-area:q} .canvas{grid-area:c} .meta-col{grid-area:m}
}
@media (max-width:900px){
  html,body{overflow:auto}
  .shell{height:auto;min-height:100vh}
  .split2,.split3,.split4,.split5{grid-template-columns:minmax(0,1fr);height:auto}
  .detail3-body{grid-template-columns:minmax(0,1fr)}
  .compare{min-height:56vh}
  .canvas .frame{height:auto;width:100%}
  .screen{min-height:0}
}
@media (pointer:coarse){
  .link,.chip,.vbtn{min-height:40px}
  .view button,.model .shot .rm{opacity:1}
}
</style>
</head>
<body>

<div class="shell">

  <header class="row top">
    <span class="wordmark">Studio Flow</span>
    <div class="top-right">
      <button class="link" data-act="reset" id="resetBtn" hidden>Lượt mới</button>
      <span class="keyhint">← → đổi bước · 1–5 nhảy bước</span>
      <div class="conn" id="conn"><span class="dot"></span><span id="connText">đang kiểm tra kết nối…</span></div>
    </div>
  </header>

  <nav class="row steps" id="steps" aria-label="Tiến trình 5 bước"></nav>

  <section class="row main">
    <div class="title-row">
      <div class="title-box">
        <h1 id="title" tabindex="-1">Chọn ảnh sản phẩm</h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="count"><b id="countA">0</b><span id="countB"></span></div>
    </div>
    <p class="notice" id="notice" hidden></p>

    <div class="screen is-on" id="s1"></div>
    <div class="screen" id="s2"></div>
    <div class="screen" id="s3"></div>
    <div class="screen" id="s4"></div>
    <div class="screen" id="s5"></div>
  </section>

  <footer class="row foot">
    <span class="note" id="footNote"></span>
    <div class="acts">
      <button class="back" id="backBtn">← Quay lại</button>
      <button class="solid" id="nextBtn">Tiếp tục →</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="vh" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<dialog class="light" id="light">
  <div class="light-in">
    <div class="light-hd"><strong id="lightTitle">Xem ảnh</strong>
      <form method="dialog"><button class="link">Đóng</button></form></div>
    <div class="light-bd"><img id="lightImg" alt=""></div>
  </div>
</dialog>

<input type="file" id="fProduct" class="vh" tabindex="-1" accept="image/jpeg,image/png,image/webp" multiple>
<input type="file" id="fView" class="vh" tabindex="-1" accept="image/jpeg,image/png,image/webp" multiple>
<input type="file" id="fModel" class="vh" tabindex="-1" accept="image/jpeg,image/png,image/webp" multiple>

<script>
"use strict";
/* Business rules fixed by the product spec. */
const MAX_PRODUCTS=5, MAX_VIEWS=8, MAX_MODELS=10, MAX_VERSIONS=4, MIN_PX=128;
const TYPES=["image/jpeg","image/png","image/webp"];
const UNIT_SECONDS={codex:{eval:60,render:80},api:{eval:12,render:25}};

const STEPS=[
  {n:1,label:"Ảnh sản phẩm",  title:"Chọn ảnh sản phẩm",        lede:"Chọn 1–5 ảnh chính. Mỗi ảnh chính trở thành một sản phẩm riêng."},
  {n:2,label:"Người mẫu",     title:"Ảnh người mẫu dùng chung", lede:"Tải 1–10 ảnh. AI tự chọn người mẫu hợp nhất cho từng sản phẩm."},
  {n:3,label:"Kiểm tra",      title:"AI kiểm tra đầu vào",      lede:"Điểm số chỉ là lời khuyên. Sản phẩm điểm thấp vẫn tạo thử được."},
  {n:4,label:"Tạo ảnh",       title:"Tạo ảnh cho từng sản phẩm",lede:"Ảnh lưu tự động, tối đa 4 phiên bản mỗi sản phẩm."},
  {n:5,label:"Quality Control",title:"Quality Control",         lede:"Kéo thanh giữa khung để so sánh sản phẩm gốc với ảnh AI."}
];

const state={
  step:1, products:[], models:[], active:null,
  analyzing:false, batchBusy:false, job:"",
  apiReady:false, backend:"api", apiModel:"gpt-image-2", allowManualOverride:true,
  connMessage:"đang kiểm tra kết nối…",
  split:50, dragging:false, zoom:1, panX:50, panY:50, ar:null
};
let seq=0, viewTarget=null;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const byId=id=>state.products.find(p=>p.id===id);
const current=()=>byId(state.active)||state.products[0]||null;

const urlCache=new WeakMap();
const objUrl=f=>{ if(!urlCache.has(f)) urlCache.set(f,URL.createObjectURL(f)); return urlCache.get(f); };
const dataCache=new WeakMap();
function asDataUrl(f){
  if(dataCache.has(f)) return dataCache.get(f);
  const job=new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(new Error(`Không đọc được ${f.name}.`)); r.readAsDataURL(f); });
  dataCache.set(f,job); return job;
}

let toastTimer=null;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),3200); }
const announce=m=>{ $("#live").textContent=m; };
const notify=m=>{ toast(m); announce(m); };
function notice(title,body){ const el=$("#notice");
  if(!title){ el.hidden=true; el.innerHTML=""; return; }
  el.hidden=false; el.innerHTML=`<b>${esc(title)}</b> ${esc(body||"")}`; }

/* Five advisory bands, mirroring the server's fiveLevel(). */
function band(score){ const v=clamp(Number(score)||0,0,100);
  if(v>=90) return {n:5,label:"Xuất sắc"}; if(v>=82) return {n:4,label:"Tốt"};
  if(v>=72) return {n:3,label:"Có thể thử"}; if(v>=60) return {n:2,label:"Rủi ro cao"};
  return {n:1,label:"Không phù hợp"}; }

function eta(units,kind){ if(!units||units<1) return "";
  const s=units*(UNIT_SECONDS[state.backend]||UNIT_SECONDS.api)[kind];
  return s<90?`khoảng ${Math.round(s)} giây`:`khoảng ${Math.round(s/60)} phút`; }

/* ------------------------------- intake --------------------------------- */
async function screenFiles(files){
  const ok=[],bad=[];
  for(const f of files){
    if(!TYPES.includes(f.type)){ bad.push(`${f.name}: chỉ nhận JPG, PNG hoặc WEBP.`); continue; }
    if(!f.size){ bad.push(`${f.name}: tệp trống.`); continue; }
    try{ const b=await createImageBitmap(f); const {width,height}=b; b.close();
      if(width<MIN_PX||height<MIN_PX){ bad.push(`${f.name}: ảnh quá nhỏ (${width}×${height}px).`); continue; }
    }catch{ bad.push(`${f.name}: không mở được ảnh.`); continue; }
    ok.push(f);
  }
  return {ok,bad};
}
const nameOf=f=>f.name.replace(/\.[^.]+$/,"").replace(/[_-](front|back|side|detail|main)$/i,"")
  .replace(/[_-]+/g," ").trim()||`Sản phẩm ${seq+1}`;

function stale(p){ p.evaluation=null; p.candidates=[]; p.selectedModel=null; p.aiPick=null; }

async function addProducts(files){
  const room=MAX_PRODUCTS-state.products.length;
  if(room<=0){ notice("Đã đủ 5 sản phẩm","Xoá bớt nếu muốn thêm sản phẩm khác."); return; }
  const {ok,bad}=await screenFiles(files);
  ok.slice(0,room).forEach(f=>{ seq+=1;
    state.products.push({id:`p${seq}`,name:nameOf(f),files:[f],evaluation:null,candidates:[],
      selectedModel:null,aiPick:null,outputs:[],selectedOutput:0,status:"idle",error:null,lastQc:null}); });
  if(ok.length) state.active=state.products[state.products.length-1].id;
  notice(bad.length?"Một số ảnh bị bỏ qua":"",bad.join(" "));
  if(ok.length) notify(`Đã thêm ${Math.min(ok.length,room)} sản phẩm.`);
  render();
}
async function addViews(p,files){
  const room=MAX_VIEWS-p.files.length;
  if(room<=0){ notice("Sản phẩm đã đủ ảnh",`Mỗi sản phẩm giữ tối đa ${MAX_VIEWS} ảnh.`); return; }
  const {ok,bad}=await screenFiles(files);
  p.files.push(...ok.slice(0,room)); stale(p);
  notice(bad.length?"Một số ảnh bị bỏ qua":"",bad.join(" ")); render();
}
async function addModels(files){
  const room=MAX_MODELS-state.models.length;
  if(room<=0){ notice("Đã đủ 10 ảnh người mẫu","Xoá bớt nếu muốn thay ảnh khác."); return; }
  const {ok,bad}=await screenFiles(files);
  state.models.push(...ok.slice(0,room)); state.products.forEach(stale);
  notice(bad.length?"Một số ảnh bị bỏ qua":"",bad.join(" "));
  if(ok.length) notify(`Đã thêm ${Math.min(ok.length,room)} ảnh người mẫu.`); render();
}

/* ------------------------------ navigation ------------------------------ */
function canEnter(n){
  if(n<=1) return true;
  if(n===2) return state.products.length>0;
  if(n===3) return state.products.length>0&&state.models.length>0;
  if(n===4) return state.products.some(p=>p.evaluation);
  return state.products.some(p=>p.outputs.length);
}
function go(n){ n=clamp(n,1,5); if(!canEnter(n)) return; state.step=n; render();
  $("#title").focus({preventScroll:true}); }

function renderSteps(){
  $("#steps").innerHTML=STEPS.map(s=>{
    const cls=["step",s.n===state.step?"is-now":"",s.n<state.step?"is-past":""].filter(Boolean).join(" ");
    let flag="";
    if(s.n===3&&state.analyzing) flag='<span class="flag">đang chấm</span>';
    if(s.n===4&&state.batchBusy) flag='<span class="flag">đang tạo</span>';
    if(s.n===4&&!state.batchBusy&&state.products.some(p=>p.error)) flag='<span class="flag">có lỗi</span>';
    return `<button class="${cls}" data-act="step" data-n="${s.n}" ${canEnter(s.n)?"":"disabled"}
      ${s.n===state.step?'aria-current="step"':""}>
      <span class="bar"></span>
      <span class="lab"><span class="n">${pad2(s.n)}</span><span class="t">${esc(s.label)}</span>${flag}</span>
    </button>`;
  }).join("");
}

/* -------------------------------- step 01 ------------------------------- */
function render1(){
  const cards=state.products.map((p,i)=>{
    const views=p.files.slice(1).map((f,vi)=>`<span class="view"><img src="${objUrl(f)}" alt="">
      <button data-act="rm-view" data-id="${p.id}" data-i="${vi+1}" aria-label="Xoá góc ${vi+1}">✕</button></span>`).join("");
    return `<article class="product">
      <div class="shot"><img src="${objUrl(p.files[0])}" alt="Ảnh chính ${esc(p.name)}"
        data-act="zoom" data-src="${objUrl(p.files[0])}" data-title="${esc(p.name)}"></div>
      <div class="meta"><span class="mono">${pad2(i+1)}</span><span class="code">${esc(p.name)}</span></div>
      ${views?`<div class="views">${views}</div>`:""}
      <div class="acts">
        <button class="link" data-act="replace" data-id="${p.id}">Thay ảnh</button>
        <button class="link" data-act="add-view" data-id="${p.id}" ${p.files.length>=MAX_VIEWS?"disabled":""}>Thêm góc ảnh</button>
        <button class="link" data-act="rm-product" data-id="${p.id}">Xoá</button>
      </div>
    </article>`;
  }).join("");
  const left=MAX_PRODUCTS-state.products.length;
  const tile=left>0?`<button class="tile" data-act="pick-product">
      <span class="plus">+</span><span class="t">Thêm ảnh chính</span><span class="s">còn ${left} chỗ</span></button>`:"";
  $("#s1").innerHTML=`<div class="scrollY" style="height:100%"><div class="grid-products">${cards}${tile}</div></div>`;
}

/* -------------------------------- step 02 ------------------------------- */
function render2(){
  const cards=state.models.map((f,i)=>`<div class="model">
      <div class="shot"><img src="${objUrl(f)}" alt="Ảnh người mẫu ${i+1}" data-act="zoom"
        data-src="${objUrl(f)}" data-title="Ảnh người mẫu ${i+1}">
        <button class="rm" data-act="rm-model" data-i="${i}" aria-label="Xoá ảnh mẫu ${i+1}">✕</button></div>
      <span class="mono">MẪU ${pad2(i+1)}</span></div>`).join("");
  const left=MAX_MODELS-state.models.length;
  const tile=left>0?`<button class="tile" style="aspect-ratio:3/4" data-act="pick-model">
      <span class="plus">+</span><span class="t" style="font-size:12.5px;color:var(--ink-3)">Tải ảnh mẫu</span></button>`:"";
  $("#s2").innerHTML=`<div class="split2">
      <div class="scrollY"><div class="grid-models">${cards}${tile}</div></div>
      <aside class="aside-col">
        <h2>Ảnh thế nào thì dễ ra kết quả đẹp?</h2>
        <div class="tip"><b>Thấy rõ toàn thân</b><span>Không cắt chân, tay hoặc phần trang phục quan trọng.</span></div>
        <div class="tip"><b>Đứng tự nhiên</b><span>Ít che thân người, góc máy chính diện hoặc chếch 3/4.</span></div>
        <div class="tip"><b>Ảnh đủ sáng, nét</b><span>Nền đơn giản giúp AI giữ đúng người mẫu hơn.</span></div>
        <span class="serif-note" style="margin-top:8px">${state.models.length} ảnh này dùng chung cho ${state.products.length} sản phẩm — không cần tải lại cho từng sản phẩm.</span>
      </aside></div>`;
}

/* -------------------------------- step 03 ------------------------------- */
function render3(){
  if(!state.products.length){ $("#s3").innerHTML=`<p class="lede">Chưa có sản phẩm. Quay lại bước 01.</p>`; return; }
  const p=current();
  const rows=state.products.map((prod,i)=>{
    const ev=prod.evaluation, sc=ev?Number(ev.compatibility?.final_score)||0:null;
    const b=sc==null?null:band(sc);
    const running=state.analyzing&&state.job===prod.id;
    return `<button class="pick" data-act="pick" data-id="${prod.id}" aria-current="${prod.id===p.id}">
      <img class="th" src="${objUrl(prod.files[0])}" alt="">
      <span class="col"><span class="nm">${esc(prod.name)}</span>
        <span class="gr">${running?"đang chấm…":b?esc(b.label):"chờ chấm"}</span></span>
      <span class="sc">${sc==null?"—":sc}</span></button>`;
  }).join("");

  const ev=p.evaluation;
  let right;
  if(!ev){
    right=`<p class="lede">${state.analyzing?"AI đang chấm lần lượt từng sản phẩm.":"Chưa chấm sản phẩm này."}
      ${state.analyzing?'<span class="spin"></span>':""}</p>`;
  }else{
    const mq=Number(ev.input_quality?.model?.score)||0;
    const pq=Number(ev.input_quality?.product?.score)||0;
    const cs=Number(ev.compatibility?.final_score)||0;
    const cell=(k,v,n,warn)=>`<div class="scorecell"><span class="k">${k}</span>
      <span class="v">${band(v).n}/5</span><span class="n ${warn?"is-warn":""}">${n}</span></div>`;
    const notes=[];
    (ev.risks||[]).slice(0,4).forEach(r=>notes.push(r.reason||r.factor));
    if(ev.compatibility?.score_cap_reason) notes.push(ev.compatibility.score_cap_reason);
    (ev.recommended_reference_requirements||[]).slice(0,2).forEach(r=>notes.push(r));
    if(!notes.length) notes.push("Không thấy rủi ro đáng kể. Ảnh đầu vào đủ để dựng lại sản phẩm.");
    // Every model image was scored — show them all so the choice stays the user's.
    const cands=(p.candidates||[]).slice().sort((a,b)=>a.index-b.index);
    const chosen=p.selectedModel??0;
    const grid=cands.map(c=>{
      const f=state.models[c.index]; if(!f) return "";
      const sc=Number(c.evaluation?.compatibility?.final_score)||0;
      const b=band(sc);
      const isAi=c.index===p.aiPick, isOn=c.index===chosen;
      return `<button class="cand ${isOn?"is-on":""}" data-act="use-model" data-id="${p.id}" data-i="${c.index}">
        <span class="shot"><img src="${objUrl(f)}" alt="Ảnh mẫu ${c.index+1}"></span>
        <span class="cl"><span class="nm">Mẫu ${pad2(c.index+1)}</span><span class="sc">${sc}</span></span>
        <span class="gr">${esc(b.label)}${isAi?"<br><b>AI đề xuất</b>":""}</span>
      </button>`;
    }).join("");
    const humanPicked=p.aiPick!=null&&chosen!==p.aiPick;

    right=`<div class="detail3">
      <div class="scores">
        ${cell("Ảnh người mẫu",mq,`${mq}/100`,mq<82)}
        ${cell("Ảnh sản phẩm",pq,`${pq}/100`,pq<85)}
        ${cell("Mức tương thích",cs,`${cs}/100`,cs<82)}
      </div>
      <div class="cand-block">
        <div class="cand-head">
          <span class="eyebrow">Người mẫu · ${cands.length} ảnh đã chấm</span>
          <span class="mono">${humanPicked?"anh đang chọn khác AI":"đang dùng ảnh AI đề xuất"}</span>
        </div>
        <div class="cand-row">${grid}</div>
      </div>
      <div class="notes scrollY">
        <span class="eyebrow">AI ghi nhận · mẫu ${pad2(chosen+1)}</span>
        ${notes.map(n=>`<p>${esc(n)}</p>`).join("")}
        <button class="link" style="align-self:flex-start" data-act="recheck" data-id="${p.id}"
          ${state.analyzing?"disabled":""}>Chấm lại sản phẩm này</button>
      </div></div>`;
  }
  $("#s3").innerHTML=`<div class="split3"><div class="pick-list scrollY">${rows}</div>${right}</div>`;
}

/* -------------------------------- step 04 ------------------------------- */
const STATUS={waiting:["Waiting",""],rendering:["Generating","run"],qc:["Needs review","ok"],
  approved:["Approved","ok"],failed:["Failed","fail"]};
function statusOf(p){ if(p.error) return "failed"; if(p.status==="rendering") return "rendering";
  if(p.status==="approved") return "approved"; if(p.outputs.length) return "qc"; return "waiting"; }

function render4(){
  if(!state.products.length){ $("#s4").innerHTML=`<p class="lede">Chưa có sản phẩm. Quay lại bước 01.</p>`; return; }
  const p=current(), st=statusOf(p), out=p.outputs[p.selectedOutput];
  const rows=state.products.map((prod,i)=>{
    const s=statusOf(prod), [txt,cls]=STATUS[s];
    return `<button class="qitem" data-act="pick" data-id="${prod.id}" aria-current="${prod.id===p.id}">
      <img class="th" src="${objUrl(prod.files[0])}" alt="">
      <span class="col" style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span class="nm">${pad2(i+1)} · ${esc(prod.name)}</span>
        <span class="st ${cls}">${s==="rendering"?'<span class="spin"></span> ':""}${txt}${prod.outputs.length?` · V${prod.selectedOutput+1}`:""}</span>
      </span></button>`;
  }).join("");

  let over="";
  if(st==="rendering") over=`<div class="over"><span class="spin"></span><b>Đang tạo ảnh</b>
    <span>${esc(p.name)}${eta(1,"render")?` · thường mất ${eta(1,"render")}`:""}</span></div>`;
  else if(st==="failed") over=`<div class="over"><b>Không tạo được</b><span>${esc(p.error||"")}</span>
    <button class="link" data-act="retry" data-id="${p.id}">Thử lại</button></div>`;
  else if(!out) over=`<div class="over"><b>Chờ đến lượt</b><span>Sản phẩm này chưa được tạo.</span></div>`;

  const meta=[["Trạng thái",STATUS[st][0]],["Ảnh tham chiếu",String(p.files.length)],
    ["Người mẫu","Mẫu "+pad2((p.selectedModel??0)+1)],
    ["Phiên bản",p.outputs.length?`${p.selectedOutput+1}/${MAX_VERSIONS}`:`0/${MAX_VERSIONS}`],
    ["Còn tạo lại",String(Math.max(0,MAX_VERSIONS-p.outputs.length))]];

  $("#s4").innerHTML=`<div class="split4">
    <div class="queue scrollY">${rows}</div>
    <div class="canvas"><div class="frame">
      ${out?`<img src="${out.image}" alt="Ảnh AI của ${esc(p.name)}">`:""}
      ${over||`<span class="mono" style="position:absolute;bottom:12px;left:12px">kết quả AI · V${p.selectedOutput+1}</span>`}
    </div></div>
    <aside class="meta-col">
      <h2>${esc(p.name)}</h2>
      ${meta.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("")}
      ${out?.savedPath?`<div class="kv"><span class="k">Lưu tự động</span><span class="v">✓</span></div>`:""}
      <button class="link" style="margin-top:auto;align-self:flex-start" data-act="regen" data-id="${p.id}"
        ${out&&!state.batchBusy&&p.outputs.length<MAX_VERSIONS?"":"disabled"}>Tạo lại (còn ${Math.max(0,MAX_VERSIONS-p.outputs.length)} lần)</button>
    </aside></div>`;
}

/* -------------------------------- step 05 ------------------------------- */
function render5(){
  const ready=state.products.filter(p=>p.outputs.length);
  if(!ready.length){ $("#s5").innerHTML=`<p class="lede">Chưa có ảnh để kiểm tra. Quay lại bước 04.</p>`; return; }
  let p=current(); if(!p||!p.outputs.length){ p=ready[0]; state.active=p.id; }
  const out=p.outputs[p.selectedOutput];
  const left=Math.max(0,MAX_VERSIONS-p.outputs.length);
  const qc=p.lastQc;

  const chips=state.products.map((prod,i)=>`<button class="chip" data-act="pick" data-id="${prod.id}"
    aria-current="${prod.id===p.id}" ${prod.outputs.length?"":"disabled"}>${pad2(i+1)} ${esc(prod.name).toUpperCase()}</button>`).join("");

  const rows=qc&&!qc.error?[["Phom dáng",qc.silhouette,25],["Chi tiết may",qc.construction_detail,25],
    ["Độ dài & tỷ lệ",qc.length_proportion,15],["Màu & chất liệu",qc.color_material,15],
    ["Giữ đúng người mẫu",qc.model_pose_preservation,10],["Giữ góc máy & cảnh",qc.scene_camera_preservation,10]]:[];

  $("#s5").innerHTML=`<div class="split5">
    <div class="qc-left">
      <div class="qc-bar">

      <div class="compare-wrap">

          <span class="tagL">SẢN PHẨM GỐC</span>
          <span class="tagR">ẢNH AI · BẢN ${p.selectedOutput+1}/${MAX_VERSIONS}</span>
          <div class="handleLine" id="hLine" style="left:${state.split}%"></div>
          <div class="handleKnob" id="hKnob" style="left:${state.split}%">⇄</div>
          ${p.status==="rendering"?`<div class="busy-veil"><span class="spin"></span>
            <b>Đang tạo bản V${p.outputs.length+1}</b>
            <span>${esc(p.name)}${eta(1,"render")?` · thường mất ${eta(1,"render")}`:""}</span>
            <span class="mono">bản hiện tại vẫn giữ nguyên</span></div>`:""}
        </div>
      </div>
      <div class="qc-foot">
        <div class="vset">${p.outputs.map((_,i)=>`<button class="vbtn" data-act="version" data-i="${i}"

        <span class="mono">${out.savedPath?"đã lưu tự động trên máy":""} · còn ${left} lần tạo lại</span>
      </div>
    </div>

    <aside class="qc-right">
      <div class="qc-score"><span class="k">Đánh giá của AI</span>
        <span class="v">${qc&&!qc.error?(Number(qc.product_fidelity_score)||0):"—"}</span></div>
      <div class="qc-list scrollY">
        ${rows.map(([k,v,m])=>`<div class="kv"><span class="k">${k}</span><span class="v">${Number(v)||0}/${m}</span></div>`).join("")}
        ${qc?.error?`<p class="lede" style="font-size:12.5px">Không chấm được tự động: ${esc(qc.error)}</p>`:""}
        ${!qc?`<p class="lede" style="font-size:12.5px">AI chấm ngay sau khi tạo xong ảnh.</p>`:""}
        ${(qc?.rerender_reasons||[]).length?`<span class="eyebrow" style="margin-top:6px">Nếu tạo lại</span>
          ${qc.rerender_reasons.slice(0,3).map(r=>`<p class="lede" style="font-size:12.5px">${esc(r)}</p>`).join("")}`:""}
        <span class="serif-note" style="margin-top:4px">Quyết định cuối cùng là của anh.</span>
      </div>
      <div class="qc-acts">
        <button class="solid" data-act="approve" data-id="${p.id}" ${state.batchBusy?"disabled":""}>Duyệt &amp; tải ảnh</button>
        <div class="pair">
          <button class="link" data-act="regen" data-id="${p.id}" ${!state.batchBusy&&left>0?"":"disabled"}>Tạo lại (${left})</button>
          <button class="link" data-act="download" data-id="${p.id}">Tải bản này</button>
          <button class="link" data-act="copy" data-id="${p.id}" ${out.savedPath?"":"disabled"}>Chép đường dẫn</button>
        </div>
      </div>
    </aside></div>`;
  // Adopt the generated image's real ratio once it decodes, then keep it.
  const ai=$("#imgAI");
  if(ai){
    const adopt=()=>{
      if(!ai.naturalWidth||!ai.naturalHeight) return;
      const ar=`${ai.naturalWidth}/${ai.naturalHeight}`;
      if(ar!==state.ar){ state.ar=ar; $("#compare")?.style.setProperty("--ar",ar); }
    };
    ai.complete?adopt():ai.addEventListener("load",adopt,{once:true});
  }
  applyZoom();
}

/* ------------------------------ head + foot ----------------------------- */
function renderHead(){
  const s=STEPS[state.step-1];
  $("#title").textContent=s.title;
  $("#lede").textContent=s.lede;
  const done=state.products.filter(p=>p.evaluation).length;
  const made=state.products.filter(p=>p.outputs.length).length;
  const ok=state.products.filter(p=>p.status==="approved").length;
  const map={1:[`${state.products.length}/${MAX_PRODUCTS}`,"sản phẩm"],
             2:[`${state.models.length}/${MAX_MODELS}`,"ảnh mẫu"],
             3:[`${done}/${state.products.length}`,"đã chấm"],
             4:[`${made}/${state.products.length}`,"hoàn tất"],
             5:[`${ok}/${state.products.length}`,"đã duyệt"]};
  $("#countA").textContent=map[state.step][0];
  $("#countB").textContent=map[state.step][1];
}

function renderFoot(){
  const note=$("#footNote"), back=$("#backBtn"), next=$("#nextBtn");
  const busy=state.analyzing?"AI đang chấm ảnh đầu vào.":state.batchBusy?"AI đang tạo ảnh.":"";
  back.style.visibility=state.step===1?"hidden":"visible";
  back.textContent="← "+(STEPS[state.step-2]?.label||"Quay lại");
  back.disabled=Boolean(busy);
  back.onclick=()=>go(state.step-1);
  next.disabled=Boolean(busy);
  next.title=busy||"";

  if(state.step===1){
    note.innerHTML=state.products.length?`<b>${state.products.length}</b> sản phẩm đã sẵn sàng.`:"Bắt đầu bằng ảnh sản phẩm.";
    next.textContent="Ảnh người mẫu →"; next.disabled=!state.products.length; next.onclick=()=>go(2); return;
  }
  if(state.step===2){
    note.innerHTML=state.models.length?`<b>${state.models.length}</b> ảnh mẫu dùng chung cho ${state.products.length} sản phẩm.`:"Cần ít nhất một ảnh người mẫu.";
    next.textContent="Kiểm tra đầu vào →"; next.disabled=!state.models.length||!state.products.length; next.onclick=()=>go(3); return;
  }
  if(state.step===3){
    const pend=state.products.filter(p=>!p.evaluation);
    const units=pend.length*Math.max(1,state.models.length);
    note.innerHTML=state.analyzing
      ? `<span class="spin"></span> Đang chấm lần lượt.${eta(units,"eval")?` Còn ${eta(units,"eval")}.`:""}`
      : pend.length?`<b>${pend.length}</b> sản phẩm chưa chấm.${eta(units,"eval")?` Khoảng ${eta(units,"eval")}.`:""}`
                   :`Đã chấm xong. Điểm thấp vẫn tạo được.`;
    next.textContent=pend.length?`Chấm ${pend.length} sản phẩm →`:"Tạo ảnh →";
    next.disabled=Boolean(busy)||!state.apiReady||!state.products.length;
    next.onclick=pend.length?()=>runAnalysis(pend):()=>go(4); return;
  }
  if(state.step===4){
    const pend=state.products.filter(p=>!p.outputs.length&&!p.error);
    note.innerHTML=state.batchBusy
      ? `<span class="spin"></span> Đang tạo từng sản phẩm.${eta(pend.length,"render")?` Còn ${eta(pend.length,"render")}.`:""}`
      : pend.length?`<b>${pend.length}</b> sản phẩm chờ tạo.${eta(pend.length,"render")?` Khoảng ${eta(pend.length,"render")}.`:""}`
                   :`<b>${state.products.filter(p=>p.outputs.length).length}</b> sản phẩm đã có ảnh.`;
    next.textContent=pend.length?`Tạo ${pend.length} sản phẩm →`:"Quality Control →";
    next.disabled=Boolean(busy)||!state.apiReady||!state.products.length;
    next.onclick=pend.length?runBatch:()=>go(5); return;
  }
  const ok=state.products.filter(p=>p.status==="approved").length;
  note.innerHTML=`<b>${ok}/${state.products.length}</b> sản phẩm đã duyệt. AI góp ý — anh quyết định.`;
  next.textContent=ok?`Tải ${ok} ảnh đã duyệt →`:"Chưa có ảnh duyệt";
  next.disabled=!ok||Boolean(busy);
  next.onclick=downloadApproved;
}

function render(){
  renderSteps(); renderHead();
  $$(".screen").forEach((el,i)=>el.classList.toggle("is-on",i+1===state.step));
  if(state.step===1) render1(); if(state.step===2) render2(); if(state.step===3) render3();
  if(state.step===4) render4(); if(state.step===5) render5();
  renderFoot();
  const reset=$("#resetBtn");
  if(reset){ reset.hidden=!state.products.length; reset.disabled=state.analyzing||state.batchBusy; }
  persist();
}

/* --------------------------------- zoom --------------------------------- */
/* One transform drives both layers, so the split always compares the same region. */
function applyZoom(){
  $$(".layer img").forEach(img=>{
    img.style.setProperty("--z",state.zoom);
    img.style.setProperty("--ox",state.panX+"%");
    img.style.setProperty("--oy",state.panY+"%");
  });
}

/* --------------------------- session persistence ------------------------- */
/* IndexedDB, not localStorage: structured clone stores the uploaded File
   objects as-is, so a reload restores the whole session — and there is no 5 MB
   ceiling to trip over once a few 2 MB renders pile up. */
const DB_NAME="studio-flow", DB_STORE="session", DB_KEY="current";
let dbPromise=null;
function idb(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((res,rej)=>{
    const rq=indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore(DB_STORE);
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
  return dbPromise;
}
function idbTx(mode,fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,mode), store=tx.objectStore(DB_STORE);
    const out=fn(store);
    tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);
    tx.onerror=()=>rej(tx.error);
  }));
}
const isDemo=()=>location.hash.startsWith("#demo");

let saveTimer=null;
function persist(){
  if(isDemo()) return;                       // never let the design harness overwrite real work
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    // "rendering" is a transient state; storing it would restore into a stuck spinner.
    const products=state.products.map(p=>({...p,status:p.status==="rendering"?(p.outputs.length?"qc":"idle"):p.status}));
    idbTx("readwrite",s=>s.put({v:1,savedAt:Date.now(),seq,step:state.step,active:state.active,
      models:state.models,products},DB_KEY)).catch(()=>{});
  },600);
}

async function restore(){
  if(isDemo()) return false;
  let saved=null;
  try{ saved=await idbTx("readonly",s=>s.get(DB_KEY)); }catch{ return false; }
  if(!saved||!Array.isArray(saved.products)||!saved.products.length) return false;
  seq=saved.seq||saved.products.length;
  state.models=saved.models||[];
  state.products=saved.products.map(p=>({...p,error:null,
    status:p.status==="rendering"?(p.outputs?.length?"qc":"idle"):p.status}));
  state.active=saved.active||state.products[0]?.id||null;
  state.step=clamp(saved.step||1,1,5);
  render();
  const mins=Math.round((Date.now()-(saved.savedAt||Date.now()))/60000);
  notify(`Đã khôi phục lượt làm dở${mins>0?` từ ${mins} phút trước`:""}.`);
  return true;
}

function resetBatch(){
  if(!state.products.length) return;
  const n=state.products.length;
  if(!confirm(`Xoá ${n} sản phẩm cùng toàn bộ ảnh đã tạo trong lượt này?\n\nẢnh người mẫu được giữ lại. Ảnh đã lưu trên đĩa không bị xoá.`)) return;
  state.products=[]; state.active=null; state.step=1; seq=0;
  idbTx("readwrite",s=>s.delete(DB_KEY)).catch(()=>{});
  notify("Đã bắt đầu lượt mới. Bộ ảnh người mẫu vẫn giữ nguyên.");
  render();
}

/* ---------------------------------- API --------------------------------- */
async function api(path,payload){
  const res=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||`Máy chủ trả lỗi ${res.status}.`);
  return data;
}

async function runAnalysis(targets){
  if(state.analyzing||state.batchBusy) return;
  if(!state.apiReady){ notice("Chưa kết nối được dịch vụ AI",connFix()); return; }
  const list=(targets&&targets.length?targets:state.products).filter(Boolean);
  if(!list.length) return;
  state.analyzing=true; notice(""); state.step=3; render();
  announce(`Bắt đầu chấm ${list.length} sản phẩm.`);
  for(const p of list){
    state.job=p.id; state.active=p.id; render();
    try{
      const [productImages,modelImages]=await Promise.all([
        Promise.all(p.files.map(asDataUrl)), Promise.all(state.models.map(asDataUrl))]);
      const data=await api("/api/evaluate",{productImages,modelImages});
      p.candidates=data.candidates||[];
      const best=p.candidates.find(c=>c.index===data.recommended_index)||p.candidates[0];
      if(!best) throw new Error("AI không trả kết quả đánh giá.");
      p.selectedModel=best.index; p.evaluation=best.evaluation; p.aiPick=best.index;
    }catch(err){
      state.analyzing=false; state.job=""; notice(`Không chấm được ${p.name}`,err.message); render(); return;
    }
  }
  state.analyzing=false; state.job=""; render(); notify("Đã chấm xong toàn bộ sản phẩm.");
}

async function generateOne(p,isRerender){
  const mi=p.selectedModel??0, mf=state.models[mi]||state.models[0];
  if(!mf) throw new Error("Chưa có ảnh người mẫu.");
  const attempt=p.outputs.length+1;
  const [modelImage,productImages]=await Promise.all([asDataUrl(mf),Promise.all(p.files.map(asDataUrl))]);
  const reasons=isRerender?((p.lastQc&&(p.lastQc.rerender_reasons||p.lastQc.critical_failure_reasons))||[]):[];
  const out=await api("/api/render",{modelImage,productImages,evaluation:p.evaluation,
    manualOverride:!(p.evaluation?.compatibility?.decision==="AUTO_RENDER"),
    productId:p.name,quality:"medium",size:"1024x1536",attempt,rerenderReasons:reasons});
  p.outputs.push({image:out.image,filename:out.filename,savedPath:out.savedPath,attempt,qc:null});
  p.selectedOutput=p.outputs.length-1; p.status="qc"; p.error=null; render();
  try{
    const qc=await api("/api/qc",{modelImage,productImages,generatedImage:out.image});
    p.lastQc=qc; p.outputs[p.selectedOutput].qc=qc;
  }catch(err){ const fb={error:err.message,decision:"MANUAL"}; p.lastQc=fb; p.outputs[p.selectedOutput].qc=fb; }
  render();
}

async function runBatch(){
  if(state.batchBusy||state.analyzing) return;
  if(!state.apiReady){ notice("Chưa kết nối được dịch vụ AI",connFix()); return; }
  const pend=state.products.filter(p=>!p.outputs.length&&!p.error);
  if(!pend.length){ go(5); return; }
  state.batchBusy=true; notice(""); state.step=4; render();
  for(const p of pend){
    state.active=p.id; p.status="rendering"; render();
    try{ await generateOne(p,false); }
    catch(err){ p.status="idle"; p.error=err.message; render(); }   // one failure never discards earlier work
  }
  state.batchBusy=false;
  const bad=state.products.filter(p=>p.error);
  render();
  if(bad.length) notice(`${bad.length} sản phẩm chưa tạo được`,bad.map(p=>`${p.name}: ${p.error}`).join(" · "));
  notify(`Đã tạo xong ${state.products.filter(p=>p.outputs.length).length} sản phẩm.`);
  if(!bad.length) go(5);
}

async function regenerate(p){
  if(state.batchBusy||state.analyzing) return;
  if(p.outputs.length>=MAX_VERSIONS){ toast("Đã dùng hết 3 lần tạo lại."); return; }
  state.batchBusy=true; p.status="rendering"; render();
  announce(`Đang tạo lại ${p.name}, bản ${p.outputs.length+1} trên ${MAX_VERSIONS}.`);
  try{ await generateOne(p,true); notify(`Đã tạo bản V${p.outputs.length} cho ${p.name}.`); }
  catch(err){ p.error=err.message; notice(`Không tạo lại được ${p.name}`,err.message); }
  finally{ state.batchBusy=false; if(p.status==="rendering") p.status=p.outputs.length?"qc":"idle"; render(); }
}

function saveOne(p,approve){
  const out=p.outputs[p.selectedOutput]; if(!out) return;
  const a=document.createElement("a"); a.href=out.image; a.download=out.filename||`${p.name}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  if(approve){ p.status="approved"; notify(`Đã duyệt ${p.name}.`); }
  render();
}
function downloadApproved(){
  const list=state.products.filter(p=>p.status==="approved"&&p.outputs[p.selectedOutput]);
  if(!list.length) return;
  list.forEach((p,i)=>setTimeout(()=>{ const out=p.outputs[p.selectedOutput];
    const a=document.createElement("a"); a.href=out.image; a.download=out.filename||`${p.name}.png`;
    document.body.appendChild(a); a.click(); a.remove(); },i*350));
  notify(`Đang tải ${list.length} ảnh đã duyệt.`);
}

/* -------------------------------- events -------------------------------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el||el.disabled) return;
  const act=el.dataset.act, p=el.dataset.id?byId(el.dataset.id):current();
  if(act==="reset") return resetBatch();
  if(act==="step") return go(Number(el.dataset.n));
  if(act==="pick"){ state.active=el.dataset.id; return render(); }
  if(act==="pick-product"){ viewTarget=null; return $("#fProduct").click(); }
  if(act==="add-view"){ viewTarget=el.dataset.id; return $("#fView").click(); }
  if(act==="replace"){ viewTarget="main:"+el.dataset.id; return $("#fView").click(); }
  if(act==="pick-model") return $("#fModel").click();
  if(act==="rm-product"){ if(!p) return;
    state.products=state.products.filter(x=>x.id!==p.id);
    if(state.active===p.id) state.active=state.products[0]?.id||null;
    notify(`Đã xoá ${p.name}.`); return render(); }
  if(act==="rm-view"){ if(!p) return; p.files.splice(Number(el.dataset.i),1); stale(p); return render(); }
  if(act==="rm-model"){ state.models.splice(Number(el.dataset.i),1); state.products.forEach(stale); return render(); }
  if(act==="zoom"){ $("#lightImg").src=el.dataset.src; $("#lightTitle").textContent=el.dataset.title||"Xem ảnh";
    return $("#light").showModal(); }
  if(act==="use-model"){
    if(!p) return;
    const idx=Number(el.dataset.i);
    const c=(p.candidates||[]).find(x=>x.index===idx);
    if(!c) return;
    // Scores are per model×product pair, so swap the evaluation with the model.
    p.selectedModel=idx; p.evaluation=c.evaluation;
    notify(idx===p.aiPick?`Đang dùng mẫu ${pad2(idx+1)} — ảnh AI đề xuất.`:`Đã đổi sang mẫu ${pad2(idx+1)} theo lựa chọn của anh.`);
    return render();
  }
  if(act==="recheck"){ if(p){ stale(p); render(); return runAnalysis([p]); } return; }
  if(act==="retry"){ if(p){ p.error=null; render(); return regenerate(p); } return; }
  if(act==="version"){ if(p){ p.selectedOutput=Number(el.dataset.i);
    p.lastQc=p.outputs[p.selectedOutput]?.qc||p.lastQc; return render(); } return; }
  if(act==="approve"){ if(p) return saveOne(p,true); return; }
  if(act==="download"){ if(p) return saveOne(p,false); return; }
  if(act==="regen"){ if(p) return regenerate(p); return; }
  if(act==="copy"){ const out=p?.outputs[p.selectedOutput]; if(!out?.savedPath) return;
    try{ await navigator.clipboard.writeText(out.savedPath); notify("Đã chép đường dẫn."); }
    catch{ toast(out.savedPath); } return; }
});

document.addEventListener("keydown",e=>{
  if(/input|textarea/i.test(e.target.tagName)) return;
  if($("#light").open) return;
  if(e.key==="ArrowRight") return go(state.step+1);
  if(e.key==="ArrowLeft") return go(state.step-1);
  if(/^[1-5]$/.test(e.key)) return go(Number(e.key));
});

/* split drag */
function setSplit(e){
  const box=$("#compare"); if(!box) return;
  const r=box.getBoundingClientRect();
  state.split=clamp(((e.clientX-r.left)/r.width)*100,3,97);
  $("#layerSrc").style.setProperty("--clip",(100-state.split)+"%");
  $("#hLine").style.left=state.split+"%";
  $("#hKnob").style.left=state.split+"%";
  const lbl=$(".qc-bar .mono"); if(lbl) lbl.textContent=`kéo thanh dọc để so sánh · ${Math.round(state.split)}%`;
}
document.addEventListener("pointerdown",e=>{
  const box=e.target.closest("#compare"); if(!box) return;
  state.dragging=true; box.setPointerCapture?.(e.pointerId); setSplit(e);
});
document.addEventListener("pointermove",e=>{ if(state.dragging) setSplit(e); });
document.addEventListener("pointerup",()=>{ state.dragging=false; });

$("#fProduct").addEventListener("change",async e=>{ const f=[...e.target.files]; e.target.value=""; if(f.length) await addProducts(f); });
$("#fModel").addEventListener("change",async e=>{ const f=[...e.target.files]; e.target.value=""; if(f.length) await addModels(f); });
$("#fView").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  if(String(viewTarget).startsWith("main:")){
    const p=byId(viewTarget.slice(5));
    if(p){ const {ok,bad}=await screenFiles(files);
      if(ok[0]){ p.files[0]=ok[0]; stale(p); notify("Đã thay ảnh chính."); }
      notice(bad.length?"Ảnh không hợp lệ":"",bad.join(" ")); render(); }
  }else{ const p=byId(viewTarget); if(p) await addViews(p,files); }
  viewTarget=null;
});

["dragenter","dragover"].forEach(t=>document.addEventListener(t,e=>{
  if(e.dataTransfer?.types?.includes("Files")) e.preventDefault(); }));
document.addEventListener("drop",async e=>{
  if(!e.dataTransfer?.files?.length) return;
  e.preventDefault();
  const files=[...e.dataTransfer.files];
  if(state.step===1) await addProducts(files); else if(state.step===2) await addModels(files);
});

/* ----------------------------- server status ---------------------------- */
const onCodex=()=>state.backend==="codex";
const connFix=()=>onCodex()
  ? "Mở PowerShell chạy codex login rồi khởi động lại Studio Flow."
  : "Khởi động lại server kèm API key rồi thử lại.";

function renderConn(){
  const box=$("#conn"), t=$("#connText");
  box.className=`conn ${state.apiReady?"is-ok":"is-error"}`;
  t.textContent=state.apiReady?(onCodex()?"gói ChatGPT · sẵn sàng":`${state.apiModel} · tính phí API`):state.connMessage;
  box.title=state.apiReady
    ?(onCodex()?"Chạy trong hạn mức gói ChatGPT. Không tốn API credit.":"Gọi OpenAI API và tính phí theo lượt.")
    :`${state.connMessage} ${connFix()}`;
}
async function checkServer(){
  const was=state.apiReady;
  try{
    const res=await fetch("/api/status",{cache:"no-store"});
    const d=await res.json();
    state.apiReady=Boolean(d.ready); state.backend=d.backend||"api";
    state.apiModel=d.model||"gpt-image-2"; state.allowManualOverride=d.allowManualOverride!==false;
    state.connMessage=state.apiReady?"":(onCodex()?"Codex chưa sẵn sàng":"chưa có API key trên máy chủ");
  }catch{ state.apiReady=false; state.connMessage="chưa kết nối được máy chủ"; }
  renderConn();
  if(!state.analyzing&&!state.batchBusy){ renderFoot();
    if(was!==state.apiReady) announce(state.apiReady?"Đã kết nối dịch vụ AI.":`Mất kết nối: ${state.connMessage}`); }
}

/* ---------------------------------- boot -------------------------------- */
renderConn(); render(); checkServer(); setInterval(checkServer,20000);
restore().catch(()=>{});

/* Design harness: `#demo3` etc. seeds fake data. Never runs for a normal visit. */
if(location.hash.startsWith("#demo")){(async()=>{
  const mk=(w,h,c,label)=>{ const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const x=cv.getContext("2d"); x.fillStyle=c; x.fillRect(0,0,w,h);
    x.fillStyle="rgba(255,255,255,.72)"; x.font="600 34px sans-serif"; x.fillText(label,24,58);
    const b=atob(cv.toDataURL("image/png").split(",")[1]); const u=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    return new File([u],label+".png",{type:"image/png"}); };
  const url=(w,h,c,l)=>{ const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const x=cv.getContext("2d"); x.fillStyle=c; x.fillRect(0,0,w,h);
    x.fillStyle="rgba(255,255,255,.8)"; x.font="600 40px sans-serif"; x.fillText(l,28,70); return cv.toDataURL("image/png"); };
  [["Đầm lụa xếp chéo","#8a7f70"],["Áo khoác dạ cổ ve","#6f7a6e"],["Chân váy xếp ly","#5c5c57"]].forEach(([n,c])=>{
    seq+=1; state.products.push({id:`p${seq}`,name:n,files:[mk(900,1200,c,n)],evaluation:null,candidates:[],
      selectedModel:null,outputs:[],selectedOutput:0,status:"idle",error:null,lastQc:null}); });
  state.products[0].files.push(mk(900,1200,"#7a6f60","góc sau"),mk(900,1200,"#6b6050","góc nghiêng"));
  state.models.push(mk(900,1200,"#9c9b95","mẫu 01"),mk(900,1200,"#84847e","mẫu 02"),mk(900,1200,"#b0afa8","mẫu 03"));
  const ev=(s,cap)=>({input_quality:{model:{score:97},product:{score:s>=90?94:86},decision:"PASS"},
    compatibility:{final_score:s,decision:s>=82?"AUTO_RENDER":"REJECT",score_cap_reason:cap},
    risks:s<80?[{factor:"sleeve",reason:"Vùng tay áo bị che một phần nên chi tiết cổ tay khó dựng lại chính xác."}]:[],
    recommended_reference_requirements:["Bổ sung ảnh mặt sau để dựng đúng khoá kéo."],product_spec:{},model_spec:{}});
  const seedCands=(p,scores,pick)=>{ p.candidates=scores.map((s,i)=>({index:i,evaluation:ev(s)}));
    p.aiPick=pick; p.selectedModel=pick; p.evaluation=p.candidates[pick].evaluation; };
  seedCands(state.products[0],[93,81,88],0);
  seedCands(state.products[1],[74,88,69],1);
  seedCands(state.products[2],[66,61,58],0);
  state.products[2].evaluation=ev(66,"Thiếu góc nhìn quan trọng nên điểm bị giới hạn.");
  const oi=url(1024,1536,"#8a7f70","AI RESULT");
  state.products[0].outputs=[{image:oi,filename:"dam-lua-v1.png",savedPath:"C:\\out\\v1.png",attempt:1,qc:null},
                             {image:oi,filename:"dam-lua-v2.png",savedPath:"C:\\out\\v2.png",attempt:2,qc:null}];
  state.products[0].selectedOutput=1; state.products[0].status="qc";
  state.products[1].outputs=[{image:oi,filename:"ao-khoac-v1.png",savedPath:"C:\\out\\b1.png",attempt:1,qc:null}];
  state.products[1].status="approved";
  state.products[2].error="Codex không tạo được output.png.";
  const qc={product_fidelity_score:96,silhouette:24,construction_detail:23,length_proportion:14,
    color_material:15,model_pose_preservation:10,scene_camera_preservation:10,critical_failure:false,
    critical_failure_reasons:[],rerender_reasons:["Cổ áo hơi lệch so với ảnh gốc"],decision:"PASS"};
  state.products[0].lastQc=qc; state.products[0].outputs[1].qc=qc;
  state.active=state.products[0].id;
  state.step=Number(location.hash.replace("#demo",""))||1;
  render();
})();}
